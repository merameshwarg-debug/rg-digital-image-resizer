<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Compressor - RG Digital</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f7fb;color:#222}
header{background:#111827;color:#fff;text-align:center;padding:28px 15px}
header h1{margin:0;font-size:30px}
.container{max-width:800px;margin:25px auto;padding:0 15px}
.card{background:#fff;padding:25px;border-radius:16px;box-shadow:0 5px 20px #0001}
.upload{border:2px dashed #999;padding:30px;text-align:center;border-radius:12px}
input{max-width:100%}
.settings{margin-top:20px}
label{font-weight:bold;display:block;margin-bottom:7px}
input[type=number]{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{background:#111827;color:#fff;border:0;padding:13px 20px;border-radius:8px;font-weight:bold;font-size:16px;margin-top:18px;cursor:pointer}
button:disabled{background:#aaa}
.info{background:#f3f4f6;padding:14px;border-radius:10px;margin-top:18px}
#result{text-align:center;margin-top:25px;display:none}
#preview{max-width:100%;max-height:500px;border-radius:10px}
.success{color:#166534;font-weight:bold;margin-top:15px}
.error{color:#b91c1c;font-weight:bold;margin-top:15px}
footer{margin-top:30px;background:#111827;color:#fff;text-align:center;padding:22px}
</style>
</head>

<body>

<header>
<h1>Image Compressor</h1>
<p>Compress Image to Your Required KB</p>
</header>

<div class="container">
<div class="card">

<div class="upload">
<h2>📸 Select Image</h2>
<p>JPG, JPEG, PNG or WebP</p>
<input type="file" id="file" accept="image/jpeg,image/png,image/webp">
</div>

<div class="settings">
<label>Maximum File Size (KB)</label>
<input type="number" id="kb" value="100" min="1">
</div>

<button id="compress" disabled>
Compress Image
</button>

<div id="original" class="info" style="display:none"></div>
<div id="status"></div>

<div id="result">
<h2>Compressed Image</h2>
<img id="preview" alt="Compressed image">
<div id="resultInfo" class="info"></div>
<button id="download">Download Image</button>
</div>

</div>
</div>

<footer>
© 2026 RG Digital Image Tools
</footer>

<script>

const fileInput=document.getElementById("file");
const kbInput=document.getElementById("kb");
const compressBtn=document.getElementById("compress");
const original=document.getElementById("original");
const status=document.getElementById("status");
const result=document.getElementById("result");
const preview=document.getElementById("preview");
const resultInfo=document.getElementById("resultInfo");
const download=document.getElementById("download");

let selectedFile=null;
let finalBlob=null;

fileInput.onchange=function(){

selectedFile=this.files[0];

if(!selectedFile){
compressBtn.disabled=true;
return;
}

compressBtn.disabled=false;
result.style.display="none";
status.innerHTML="";

original.style.display="block";

original.innerHTML=
"<b>Original Size:</b> "+
size(selectedFile.size);

};


compressBtn.onclick=async function(){

if(!selectedFile)return;

let maxKB=parseFloat(kbInput.value);

if(!maxKB || maxKB<1){
status.innerHTML='<div class="error">Enter a valid KB limit.</div>';
return;
}

compressBtn.disabled=true;

status.innerHTML="⏳ Compressing... Please wait.";

const reader=new FileReader();

reader.onload=function(e){

const img=new Image();

img.onload=async function(){

finalBlob=await compress(img,maxKB*1024);

if(!finalBlob){

status.innerHTML=
'<div class="error">Unable to compress this image to the selected size.</div>';

compressBtn.disabled=false;
return;
}

if(finalBlob.size>maxKB*1024){

status.innerHTML=
'<div class="error">Download blocked: file is above your KB limit.</div>';

compressBtn.disabled=false;
return;
}

preview.src=URL.createObjectURL(finalBlob);

result.style.display="block";

resultInfo.innerHTML=
"<b>Final Size:</b> "+
size(finalBlob.size)+
"<br><b>Maximum Allowed:</b> "+
maxKB+" KB";

status.innerHTML=
'<div class="success">Compression successful! ✅</div>';

compressBtn.disabled=false;

};

img.onerror=function(){

status.innerHTML=
'<div class="error">Invalid image.</div>';

compressBtn.disabled=false;

};

img.src=e.target.result;

};

reader.readAsDataURL(selectedFile);

};


async function compress(img,limit){

let width=img.naturalWidth;
let height=img.naturalHeight;

let scale=Math.min(1,1600/width,1600/height);

width=Math.max(20,Math.round(width*scale));
height=Math.max(20,Math.round(height*scale));

for(let round=0;round<12;round++){

const canvas=document.createElement("canvas");

canvas.width=width;
canvas.height=height;

const ctx=canvas.getContext("2d");

ctx.fillStyle="#fff";
ctx.fillRect(0,0,width,height);

ctx.drawImage(img,0,0,width,height);

const qualities=[
.80,.60,.45,.30,.20,.12,.07,.03,.01
];

for(const q of qualities){

const blob=await jpg(canvas,q);

if(blob && blob.size<=limit){

return blob;

}

}

width=Math.max(20,Math.floor(width*.80));
height=Math.max(20,Math.floor(height*.80));

}

return null;

}


function jpg(canvas,q){

return new Promise(resolve=>{

canvas.toBlob(
blob=>resolve(blob),
"image/jpeg",
q
);

});

}


download.onclick=function(){

if(!finalBlob)return;

const maxKB=parseFloat(kbInput.value);

if(finalBlob.size>maxKB*1024){

alert("Download blocked. File is larger than your selected KB.");

return;
}

const url=URL.createObjectURL(finalBlob);

const a=document.createElement("a");

a.href=url;
a.download="rg-digital-compressed.jpg";

document.body.appendChild(a);
a.click();
document.body.removeChild(a);

setTimeout(()=>{
URL.revokeObjectURL(url);
},1000);

};


function size(bytes){

return (bytes/1024).toFixed(2)+" KB";

}

</script>

</body>
</html>
