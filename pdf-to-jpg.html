<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF to JPG - RG Digital</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#eef2ff,#f8fafc);
color:#172033;
}

header{
background:linear-gradient(135deg,#111827,#1e3a8a,#312e81);
color:#fff;
text-align:center;
padding:28px 15px;
}

header h1{
margin:0;
font-size:30px;
}

header p{
margin:8px 0 0;
}

.container{
max-width:900px;
margin:25px auto;
padding:15px;
}

.card{
background:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 8px 30px #0002;
}

.upload{
border:2px dashed #64748b;
border-radius:15px;
padding:30px;
text-align:center;
background:#f8fafc;
}

input[type=file]{
max-width:100%;
margin:15px;
}

.password-box{
display:none;
margin-top:20px;
padding:20px;
background:#f8fafc;
border:1px solid #dbeafe;
border-radius:14px;
}

.password-box input{
width:100%;
padding:13px;
font-size:16px;
border:1px solid #cbd5e1;
border-radius:9px;
}

button{
border:0;
border-radius:10px;
padding:13px 20px;
margin:8px 5px;
background:#1e3a8a;
color:white;
font-weight:bold;
font-size:15px;
cursor:pointer;
}

button:disabled{
background:#94a3b8;
cursor:not-allowed;
}

.center{
text-align:center;
}

.status{
text-align:center;
font-weight:bold;
margin:20px 0;
min-height:22px;
}

.success{color:#15803d}
.error{color:#dc2626}
.info{color:#475569}

.pages{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
margin-top:25px;
}

.page{
background:#f8fafc;
border:1px solid #e2e8f0;
border-radius:14px;
padding:12px;
text-align:center;
}

.page img{
width:100%;
height:auto;
display:block;
border-radius:8px;
}

.page-title{
font-weight:bold;
margin:5px 0 12px;
}

.download{
background:#15803d;
font-size:14px;
}

@media(max-width:650px){
.pages{grid-template-columns:1fr}
.card{padding:16px}
header h1{font-size:25px}
button{width:100%;margin:6px 0}
}
</style>
</head>

<body>

<header>
<h1>📄 PDF to JPG</h1>
<p>Convert PDF Pages into JPG Images</p>
</header>

<div class="container">

<div class="card">

<div class="upload">

<h2>📁 Select PDF</h2>

<input
id="pdfFile"
type="file"
accept=".pdf,application/pdf">

<p>Select normal or password protected PDF</p>

</div>

<div
id="passwordBox"
class="password-box">

<h3>🔐 PDF Password Required</h3>

<p>Enter the correct password to open this PDF.</p>

<input
id="passwordInput"
type="password"
placeholder="Enter PDF Password"
autocomplete="off">

<div class="center">

<button id="unlockBtn">
🔓 Open PDF
</button>

</div>

</div>

<div class="center">

<button
id="convertBtn"
disabled>
🖼️ Convert PDF to JPG
</button>

<button
id="downloadAllBtn"
disabled>
⬇️ Download All JPG
</button>

</div>

<div id="status" class="status"></div>

<div id="pages" class="pages"></div>

</div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


const fileInput =
document.getElementById("pdfFile");

const passwordBox =
document.getElementById("passwordBox");

const passwordInput =
document.getElementById("passwordInput");

const unlockBtn =
document.getElementById("unlockBtn");

const convertBtn =
document.getElementById("convertBtn");

const downloadAllBtn =
document.getElementById("downloadAllBtn");

const status =
document.getElementById("status");

const pages =
document.getElementById("pages");


let pdfData = null;
let pdfDoc = null;
let images = [];


/* STATUS */

function setStatus(text,type="info"){

status.className =
"status " + type;

status.textContent =
text;

}


/* RESET */

function reset(){

pdfDoc=null;
images=[];

pages.innerHTML="";

passwordBox.style.display="none";

passwordInput.value="";

convertBtn.disabled=true;

downloadAllBtn.disabled=true;

}


/* FILE SELECT */

fileInput.addEventListener(
"change",
async function(){

reset();

const file =
this.files[0];

if(!file){
return;
}

setStatus(
"⏳ PDF तपासत आहे...",
"info"
);

try{

pdfData =
new Uint8Array(
await file.arrayBuffer()
);


/*
Try opening without password.
*/

await openPDF(null);


setStatus(
"✅ PDF successfully opened.",
"success"
);

}
catch(error){

console.log(error);


/*
PDF password required
*/

if(
error &&
error.name ===
"PasswordException"
){

passwordBox.style.display =
"block";

setStatus(
"🔐 PDF password मागत आहे.",
"error"
);

passwordInput.focus();

}
else{

setStatus(
"❌ PDF open करता आली नाही.",
"error"
);

}

}

});


/* PASSWORD OPEN */

unlockBtn.addEventListener(
"click",
async function(){

const password =
passwordInput.value;

if(!password){

setStatus(
"⚠️ Password टाका.",
"error"
);

passwordInput.focus();

return;
}

unlockBtn.disabled=true;

setStatus(
"⏳ Password तपासत आहे...",
"info"
);


try{

await openPDF(password);


passwordBox.style.display =
"none";

setStatus(
"✅ Password बरोबर आहे. PDF open झाली.",
"success"
);

}
catch(error){

console.log(error);

setStatus(
"❌ Password चुकीचा आहे किंवा PDF उघडता आली नाही.",
"error"
);

passwordInput.select();

unlockBtn.disabled=false;

}

});


/* ENTER KEY */

passwordInput.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){
unlockBtn.click();
}

});


/*
-----------------------------------------
OPEN PDF
-----------------------------------------
*/

function openPDF(password){

return new Promise(
function(resolve,reject){

let task;


try{

task =
pdfjsLib.getDocument({
data:pdfData,
password:password || undefined
});


}
catch(error){

reject(error);
return;

}


/*
PDF.js handles password internally.
*/

task.promise.then(

function(pdf){

pdfDoc=pdf;

convertBtn.disabled=false;

resolve(pdf);

},

function(error){

reject(error);

}

);

});

}


/*
-----------------------------------------
CONVERT PDF TO JPG
-----------------------------------------
*/

convertBtn.addEventListener(
"click",
async function(){

if(!pdfDoc){
return;
}

convertBtn.disabled=true;

downloadAllBtn.disabled=true;

pages.innerHTML="";

images=[];


try{

for(
let i=1;
i<=pdfDoc.numPages;
i++
){

setStatus(
"⏳ Page "+
i+
" / "+
pdfDoc.numPages+
" convert होत आहे...",
"info"
);


const page =
await pdfDoc.getPage(i);


/*
High quality
*/

const scale=2;

const viewport =
page.getViewport({
scale:scale
});


const canvas =
document.createElement("canvas");

const context =
canvas.getContext("2d");


canvas.width =
Math.ceil(viewport.width);

canvas.height =
Math.ceil(viewport.height);


await page.render({

canvasContext:context,

viewport:viewport

}).promise;


const blob =
await new Promise(
function(resolve){

canvas.toBlob(
function(result){

resolve(result);

},
"image/jpeg",
0.95
);

});


if(!blob){

throw new Error(
"JPG conversion failed"
);

}


images.push(blob);


/*
Preview
*/

createPreview(
blob,
i
);

}


setStatus(
"✅ PDF → JPG conversion पूर्ण झाले.",
"success"
);

downloadAllBtn.disabled=false;

}
catch(error){

console.error(error);

setStatus(
"❌ JPG conversion failed.",
"error"
);

}

convertBtn.disabled=false;

});


/*
-----------------------------------------
PREVIEW
-----------------------------------------
*/

function createPreview(
blob,
number
){

const url =
URL.createObjectURL(blob);


const box =
document.createElement("div");

box.className="page";


const title =
document.createElement("div");

title.className="page-title";

title.textContent =
"Page "+number;


const img =
document.createElement("img");

img.src=url;


const button =
document.createElement("button");

button.className="download";

button.textContent =
"⬇️ Download JPG";


button.onclick =
function(){

download(
blob,
"page-"+number+".jpg"
);

};


box.appendChild(title);

box.appendChild(img);

box.appendChild(button);

pages.appendChild(box);

}


/*
-----------------------------------------
DOWNLOAD
-----------------------------------------
*/

function download(
blob,
filename
){

const url =
URL.createObjectURL(blob);

const a =
document.createElement("a");

a.href=url;

a.download=filename;

document.body.appendChild(a);

a.click();

a.remove();


setTimeout(
function(){

URL.revokeObjectURL(url);

},
1000
);

}


/*
-----------------------------------------
DOWNLOAD ALL
-----------------------------------------
*/

downloadAllBtn.addEventListener(
"click",
async function(){

if(!images.length){
return;
}

downloadAllBtn.disabled=true;

setStatus(
"⏳ JPG files download होत आहेत...",
"info"
);


for(
let i=0;
i<images.length;
i++
){

download(
images[i],
"page-"+(i+1)+".jpg"
);

await new Promise(
function(resolve){

setTimeout(
resolve,
500
);

});

}


setStatus(
"✅ सर्व JPG downloads सुरू झाले.",
"success"
);

downloadAllBtn.disabled=false;

});

</script>

</body>
</html>
