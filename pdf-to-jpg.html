<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF to JPG - RG Digital</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#eef2ff,#f8fafc);
 color:#172033;
}
header{
 background:linear-gradient(135deg,#111827,#1e3a8a,#312e81);
 color:#fff;
 text-align:center;
 padding:28px 15px;
}
header h1{margin:0;font-size:30px}
header p{margin:8px 0 0}
.container{max-width:900px;margin:25px auto;padding:15px}
.card{
 background:#fff;
 padding:25px;
 border-radius:20px;
 box-shadow:0 8px 30px #0002;
}
.upload{
 border:2px dashed #64748b;
 border-radius:15px;
 padding:30px;
 text-align:center;
 background:#f8fafc;
}
input[type=file]{max-width:100%;margin:15px}
.passwordBox{
 display:none;
 margin-top:20px;
 padding:20px;
 background:#f8fafc;
 border:1px solid #cbd5e1;
 border-radius:14px;
}
.passwordBox input{
 width:100%;
 padding:14px;
 border:1px solid #94a3b8;
 border-radius:10px;
 font-size:17px;
}
button{
 border:0;
 border-radius:10px;
 padding:13px 20px;
 margin:8px 5px;
 background:#1e3a8a;
 color:white;
 font-weight:bold;
 font-size:15px;
 cursor:pointer;
}
button:disabled{
 background:#94a3b8;
 cursor:not-allowed;
}
.center{text-align:center}
.status{
 text-align:center;
 font-weight:bold;
 margin:20px 0;
 min-height:24px;
}
.success{color:#15803d}
.error{color:#dc2626}
.info{color:#475569}

.pages{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:20px;
 margin-top:25px;
}
.page{
 background:#f8fafc;
 border:1px solid #e2e8f0;
 border-radius:14px;
 padding:12px;
 text-align:center;
}
.page img{
 width:100%;
 display:block;
 border-radius:8px;
}
.pageTitle{
 font-weight:bold;
 margin:5px 0 12px;
}
.download{
 background:#15803d;
}
@media(max-width:650px){
 .pages{grid-template-columns:1fr}
 .card{padding:16px}
 header h1{font-size:25px}
 button{width:100%;margin:6px 0}
}
</style>
</head>

<body>

<header>
<h1>📄 PDF to JPG</h1>
<p>Convert PDF Pages into JPG Images</p>
</header>

<div class="container">
<div class="card">

<div class="upload">
<h2>📁 Select PDF</h2>

<input
 id="pdfFile"
 type="file"
 accept="application/pdf,.pdf">

<p>Normal आणि Password Protected PDF दोन्ही वापरा.</p>
</div>

<div id="passwordBox" class="passwordBox">

<h3>🔐 PDF Password</h3>

<p id="passwordMessage">
ही PDF password protected आहे.
</p>

<input
 id="passwordInput"
 type="password"
 placeholder="PDF Password टाका"
 autocomplete="off">

<div class="center">
<button id="passwordBtn">
🔓 Open PDF
</button>
</div>

</div>

<div class="center">

<button id="convertBtn" disabled>
🖼️ Convert PDF to JPG
</button>

<button id="downloadAllBtn" disabled>
⬇️ Download All JPG
</button>

</div>

<div id="status" class="status"></div>

<div id="pages" class="pages"></div>

</div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


const fileInput =
document.getElementById("pdfFile");

const passwordBox =
document.getElementById("passwordBox");

const passwordInput =
document.getElementById("passwordInput");

const passwordBtn =
document.getElementById("passwordBtn");

const passwordMessage =
document.getElementById("passwordMessage");

const convertBtn =
document.getElementById("convertBtn");

const downloadAllBtn =
document.getElementById("downloadAllBtn");

const statusBox =
document.getElementById("status");

const pagesBox =
document.getElementById("pages");


let pdfBytes = null;
let pdfDocument = null;
let loadingTask = null;
let jpgFiles = [];



function status(message,type="info"){

 statusBox.className="status "+type;
 statusBox.textContent=message;

}



function reset(){

 if(loadingTask){

  try{
   loadingTask.destroy();
  }catch(e){}

 }

 pdfDocument=null;
 loadingTask=null;
 jpgFiles=[];

 pagesBox.innerHTML="";

 passwordBox.style.display="none";

 passwordInput.value="";

 convertBtn.disabled=true;

 downloadAllBtn.disabled=true;

}



fileInput.addEventListener("change",async function(){

 reset();

 const file=this.files[0];

 if(!file)return;

 status("⏳ PDF वाचत आहे...","info");

 try{

  pdfBytes=new Uint8Array(
   await file.arrayBuffer()
  );

  await loadPDF();

 }catch(error){

  console.error(error);

  status(
   "❌ PDF उघडता आली नाही.",
   "error"
  );

 }

});



function loadPDF(){

 return new Promise((resolve,reject)=>{

  let finished=false;

  loadingTask=pdfjsLib.getDocument({
   data:pdfBytes
  });


  loadingTask.onPassword=function(
   updatePassword,
   reason
  ){

   passwordBox.style.display="block";

   if(
    reason ===
    pdfjsLib.PasswordResponses.NEED_PASSWORD
   ){

    passwordMessage.textContent =
    "🔐 ही PDF password protected आहे. Password टाका.";

   }else{

    passwordMessage.textContent =
    "❌ Password चुकीचा आहे. पुन्हा password टाका.";

   }

   passwordBtn.disabled=false;

   passwordInput.focus();

   passwordBtn.onclick=function(){

    const password =
    passwordInput.value;

    if(!password){

     passwordMessage.textContent =
     "⚠️ Password टाका.";

     return;

    }

    passwordBtn.disabled=true;

    status(
     "🔓 Password तपासत आहे...",
     "info"
    );

    updatePassword(password);

   };

  };


  loadingTask.promise.then(

   function(pdf){

    if(finished)return;

    finished=true;

    pdfDocument=pdf;

    passwordBox.style.display="none";

    convertBtn.disabled=false;

    status(
     "✅ PDF successfully open झाली. आता Convert करा.",
     "success"
    );

    resolve(pdf);

   },

   function(error){

    if(finished)return;

    finished=true;

    console.error(error);

    reject(error);

   }

  );

 });

}



convertBtn.addEventListener(
"click",
async function(){

 if(!pdfDocument)return;

 convertBtn.disabled=true;
 downloadAllBtn.disabled=true;

 pagesBox.innerHTML="";
 jpgFiles=[];

 try{

  for(
   let pageNumber=1;
   pageNumber<=pdfDocument.numPages;
   pageNumber++
  ){

   status(
    "⏳ Page "+
    pageNumber+
    " / "+
    pdfDocument.numPages+
    " JPG मध्ये convert होत आहे...",
    "info"
   );


   const page =
   await pdfDocument.getPage(pageNumber);


   const scale=2.5;

   const viewport =
   page.getViewport({
    scale:scale
   });


   const canvas =
   document.createElement("canvas");

   const context =
   canvas.getContext("2d",{
    alpha:false
   });


   canvas.width=
   Math.ceil(viewport.width);

   canvas.height=
   Math.ceil(viewport.height);


   await page.render({

    canvasContext:context,
    viewport:viewport,

    background:"white"

   }).promise;


   const blob =
   await new Promise(resolve=>{

    canvas.toBlob(
     resolve,
     "image/jpeg",
     0.95
    );

   });


   if(!blob){

    throw new Error(
     "JPG conversion failed"
    );

   }


   jpgFiles.push(blob);

   createPreview(
    blob,
    pageNumber
   );

  }


  status(
   "✅ PDF → JPG conversion पूर्ण झाले!",
   "success"
  );

  downloadAllBtn.disabled=false;

 }catch(error){

  console.error(error);

  status(
   "❌ JPG conversion मध्ये समस्या आली.",
   "error"
  );

 }

 convertBtn.disabled=false;

});



function createPreview(blob,pageNumber){

 const url =
 URL.createObjectURL(blob);

 const box =
 document.createElement("div");

 box.className="page";


 const title =
 document.createElement("div");

 title.className="pageTitle";

 title.textContent=
 "Page "+pageNumber;


 const image =
 document.createElement("img");

 image.src=url;


 const button =
 document.createElement("button");

 button.className="download";

 button.textContent=
 "⬇️ Download JPG";


 button.onclick=function(){

  downloadBlob(
   blob,
   "page-"+pageNumber+".jpg"
  );

 };


 box.appendChild(title);
 box.appendChild(image);
 box.appendChild(button);

 pagesBox.appendChild(box);

}



function downloadBlob(blob,filename){

 const url =
 URL.createObjectURL(blob);

 const a =
 document.createElement("a");

 a.href=url;
 a.download=filename;

 document.body.appendChild(a);

 a.click();

 a.remove();

 setTimeout(
  ()=>URL.revokeObjectURL(url),
 1000
 );

}



downloadAllBtn.addEventListener(
"click",
async function(){

 if(!jpgFiles.length)return;

 downloadAllBtn.disabled=true;

 status(
  "⏳ JPG files download होत आहेत...",
  "info"
 );


 for(
  let i=0;
  i<jpgFiles.length;
  i++
 ){

  downloadBlob(
   jpgFiles[i],
   "page-"+(i+1)+".jpg"
  );

  await new Promise(
   resolve=>setTimeout(resolve,600)
  );

 }


 status(
  "✅ सर्व JPG files download सुरू झाले.",
  "success"
 );

 downloadAllBtn.disabled=false;

});

</script>

</body>
</html>
