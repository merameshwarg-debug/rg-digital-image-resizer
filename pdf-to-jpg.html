<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PDF to JPG & ID Card - RG Digital</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#eef2ff,#f8fafc);
color:#172033;
}

header{
background:linear-gradient(135deg,#111827,#1e3a8a,#4f46e5);
color:white;
text-align:center;
padding:28px 15px;
}

header h1{
margin:0;
font-size:30px;
}

header p{
margin:8px 0 0;
}

.container{
max-width:950px;
margin:25px auto;
padding:15px;
}

.card{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 8px 30px #0002;
}

.upload{
border:2px dashed #64748b;
border-radius:15px;
padding:30px;
text-align:center;
background:#f8fafc;
}

input[type=file]{
max-width:100%;
margin:15px;
}

.passwordBox{
display:none;
margin-top:20px;
padding:20px;
background:#f8fafc;
border:1px solid #cbd5e1;
border-radius:14px;
}

.passwordBox input{
width:100%;
padding:14px;
border:1px solid #94a3b8;
border-radius:10px;
font-size:17px;
}

button{
border:0;
border-radius:10px;
padding:13px 20px;
margin:7px 4px;
color:white;
background:#1e3a8a;
font-weight:bold;
font-size:15px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

button:disabled{
background:#94a3b8;
cursor:not-allowed;
}

.center{
text-align:center;
}

.status{
text-align:center;
font-weight:bold;
margin:20px 0;
min-height:24px;
}

.success{color:#15803d}
.error{color:#dc2626}
.info{color:#475569}

.pages{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
margin-top:25px;
}

.page{
background:#f8fafc;
border:1px solid #e2e8f0;
border-radius:14px;
padding:12px;
text-align:center;
}

.page img{
width:100%;
display:block;
border-radius:8px;
background:white;
}

.pageTitle{
font-weight:bold;
margin:5px 0 12px;
}

.download{
background:#15803d;
}

.idButton{
background:linear-gradient(135deg,#7c3aed,#2563eb);
}

@media(max-width:650px){

.pages{
grid-template-columns:1fr;
}

.card{
padding:16px;
}

header h1{
font-size:25px;
}

button{
width:100%;
margin:6px 0;
}

}
</style>
</head>

<body>

<header>

<h1>📄 PDF to JPG</h1>

<p>Convert PDF Pages into JPG & Create ID Card</p>

</header>


<div class="container">

<div class="card">

<div class="upload">

<h2>📁 Select PDF</h2>

<input
id="pdfFile"
type="file"
accept="application/pdf,.pdf">

<p>
Normal आणि Password Protected PDF दोन्ही वापरा.
</p>

</div>


<div
id="passwordBox"
class="passwordBox">

<h3>🔐 PDF Password</h3>

<p id="passwordMessage">
ही PDF password protected आहे.
</p>

<input
id="passwordInput"
type="password"
placeholder="PDF Password टाका"
autocomplete="off">

<div class="center">

<button id="passwordBtn">
🔓 Open PDF
</button>

</div>

</div>


<div class="center">

<button
id="convertBtn"
disabled>

🖼️ Convert PDF to JPG

</button>


<button
id="downloadAllBtn"
disabled>

⬇️ Download All JPG

</button>

</div>


<div
id="status"
class="status">
</div>


<div
id="pages"
class="pages">
</div>

</div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


const fileInput =
document.getElementById("pdfFile");

const passwordBox =
document.getElementById("passwordBox");

const passwordInput =
document.getElementById("passwordInput");

const passwordBtn =
document.getElementById("passwordBtn");

const passwordMessage =
document.getElementById("passwordMessage");

const convertBtn =
document.getElementById("convertBtn");

const downloadAllBtn =
document.getElementById("downloadAllBtn");

const statusBox =
document.getElementById("status");

const pagesBox =
document.getElementById("pages");


let pdfBytes=null;

let pdfDocument=null;

let loadingTask=null;

let jpgFiles=[];



function showStatus(message,type){

statusBox.className=
"status "+type;

statusBox.textContent=
message;

}



function resetAll(){

if(loadingTask){

try{
loadingTask.destroy();
}catch(e){}

}

pdfDocument=null;

loadingTask=null;

jpgFiles=[];

pagesBox.innerHTML="";

passwordBox.style.display="none";

passwordInput.value="";

convertBtn.disabled=true;

downloadAllBtn.disabled=true;

}



fileInput.addEventListener(
"change",
async function(){

resetAll();

const file=this.files[0];

if(!file)return;


showStatus(
"⏳ PDF वाचत आहे...",
"info"
);


try{

pdfBytes=
new Uint8Array(
await file.arrayBuffer()
);


loadPDF();


}catch(error){

console.error(error);

showStatus(
"❌ PDF वाचता आली नाही.",
"error"
);

}

});



function loadPDF(){

loadingTask=
pdfjsLib.getDocument({
data:pdfBytes
});


loadingTask.onPassword=
function(updatePassword,reason){

passwordBox.style.display=
"block";


if(
reason ===
pdfjsLib.PasswordResponses.NEED_PASSWORD
){

passwordMessage.textContent=
"🔐 ही PDF password protected आहे. Password टाका.";

}else{

passwordMessage.textContent=
"❌ Password चुकीचा आहे. पुन्हा password टाका.";

}


passwordBtn.disabled=false;

passwordInput.focus();


passwordBtn.onclick=
function(){

const password=
passwordInput.value;


if(!password){

passwordMessage.textContent=
"⚠️ Password टाका.";

return;

}


passwordBtn.disabled=true;


showStatus(
"🔓 Password तपासत आहे...",
"info"
);


updatePassword(password);

};

};



loadingTask.promise.then(

function(pdf){

pdfDocument=pdf;


passwordBox.style.display=
"none";


convertBtn.disabled=false;


showStatus(
"✅ PDF successfully open झाली. आता Convert करा.",
"success"
);

},


function(error){

console.error(error);


showStatus(
"❌ PDF उघडता आली नाही.",
"error"
);

}

);

}



/* ENTER PASSWORD */

passwordInput.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

passwordBtn.click();

}

});



/* PDF TO JPG */

convertBtn.addEventListener(
"click",
async function(){

if(!pdfDocument)return;


convertBtn.disabled=true;

downloadAllBtn.disabled=true;

pagesBox.innerHTML="";

jpgFiles=[];


try{

for(
let pageNumber=1;
pageNumber<=pdfDocument.numPages;
pageNumber++
){

showStatus(
"⏳ Page "+
pageNumber+
" / "+
pdfDocument.numPages+
" JPG मध्ये convert होत आहे...",
"info"
);


const page=
await pdfDocument.getPage(
pageNumber
);


const scale=2.5;


const viewport=
page.getViewport({
scale:scale
});


const canvas=
document.createElement(
"canvas"
);


const context=
canvas.getContext(
"2d",
{alpha:false}
);


canvas.width=
Math.ceil(viewport.width);

canvas.height=
Math.ceil(viewport.height);


await page.render({

canvasContext:context,

viewport:viewport,

background:"white"

}).promise;


const blob=
await new Promise(
resolve=>{

canvas.toBlob(
resolve,
"image/jpeg",
0.95
);

});


if(!blob){

throw new Error(
"JPG conversion failed"
);

}


jpgFiles.push(blob);


createPreview(
blob,
pageNumber
);

}


showStatus(
"✅ PDF → JPG conversion पूर्ण झाले!",
"success"
);


downloadAllBtn.disabled=false;


}catch(error){

console.error(error);


showStatus(
"❌ JPG conversion मध्ये समस्या आली.",
"error"
);

}


convertBtn.disabled=false;

});



/* PREVIEW + BUTTONS */

function createPreview(
blob,
pageNumber
){

const url=
URL.createObjectURL(blob);


const box=
document.createElement("div");

box.className="page";


const title=
document.createElement("div");

title.className="pageTitle";

title.textContent=
"Page "+pageNumber;


const image=
document.createElement("img");

image.src=url;


const downloadButton=
document.createElement("button");

downloadButton.className=
"download";

downloadButton.textContent=
"⬇️ Download JPG";


downloadButton.onclick=
function(){

downloadBlob(
blob,
"page-"+pageNumber+".jpg"
);

};



/* CREATE ID CARD */

const idButton=
document.createElement("button");

idButton.className=
"idButton";

idButton.textContent=
"🪪 Create ID Card";


idButton.onclick=
function(){

createIDCard(
blob,
pageNumber
);

};


box.appendChild(title);

box.appendChild(image);

box.appendChild(downloadButton);

box.appendChild(idButton);


pagesBox.appendChild(box);

}



/* DOWNLOAD JPG */

function downloadBlob(
blob,
filename
){

const url=
URL.createObjectURL(blob);


const a=
document.createElement("a");

a.href=url;

a.download=filename;

document.body.appendChild(a);

a.click();

a.remove();


setTimeout(
function(){

URL.revokeObjectURL(url);

},
1000
);

}



/* DOWNLOAD ALL */

downloadAllBtn.addEventListener(
"click",
async function(){

if(!jpgFiles.length)return;


downloadAllBtn.disabled=true;


showStatus(
"⏳ सर्व JPG download होत आहेत...",
"info"
);


for(
let i=0;
i<jpgFiles.length;
i++
){

downloadBlob(
jpgFiles[i],
"page-"+(i+1)+".jpg"
);


await new Promise(
resolve=>
setTimeout(resolve,600)
);

}


showStatus(
"✅ सर्व JPG download सुरू झाले.",
"success"
);


downloadAllBtn.disabled=false;

});



/* ===========================
   CREATE ID CARD
=========================== */

function createIDCard(
blob,
pageNumber
){

const reader=
new FileReader();


reader.onload=
function(){

const imageData=
reader.result;


const win=
window.open(
"",
"_blank"
);


if(!win){

alert(
"Popup blocked आहे. Browser मध्ये popup allow करा."
);

return;

}


win.document.write(`

<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>RG Digital ID Card</title>


<style>

*{
box-sizing:border-box;
}

body{

margin:0;

font-family:Arial,sans-serif;

background:#eef2ff;

text-align:center;

padding:20px;

}

h2{

color:#172033;

}

.controls{

background:white;

max-width:900px;

margin:auto;

padding:15px;

border-radius:15px;

box-shadow:0 5px 20px #0002;

}

.controls input{

padding:10px;

width:220px;

margin:5px;

border:1px solid #cbd5e1;

border-radius:8px;

}


.card{

width:856px;

max-width:95vw;

aspect-ratio:1.586/1;

margin:25px auto;

background:white;

border:3px solid #1e3a8a;

border-radius:18px;

overflow:hidden;

position:relative;

box-shadow:0 10px 35px #0003;

}

.cardHeader{

height:22%;

background:
linear-gradient(
135deg,
#111827,
#1e3a8a,
#4f46e5
);

color:white;

display:flex;

align-items:center;

justify-content:center;

font-size:30px;

font-weight:bold;

}

.cardBody{

height:78%;

display:flex;

align-items:center;

padding:25px;

}

.photoArea{

width:40%;

height:85%;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

}

.photoArea img{

max-width:100%;

max-height:100%;

object-fit:contain;

border-radius:8px;

}

.infoArea{

width:60%;

text-align:left;

padding:20px;

}

.infoArea h3{

margin:0 0 20px;

font-size:25px;

color:#1e3a8a;

}

.infoRow{

display:flex;

gap:10px;

margin:12px 0;

}

.infoLabel{

font-weight:bold;

min-width:110px;

}

.infoInput{

flex:1;

border:0;

border-bottom:1px solid #94a3b8;

outline:none;

font-size:16px;

}

.footer{

position:absolute;

bottom:8px;

left:0;

right:0;

text-align:center;

font-size:12px;

color:#64748b;

}

button{

border:0;

border-radius:10px;

padding:13px 20px;

margin:6px;

background:#1e3a8a;

color:white;

font-weight:bold;

font-size:15px;

cursor:pointer;

}

.print{

background:#15803d;

}

@media print{

body{

background:white;

padding:0;

}

.controls,
h2{

display:none;

}

.card{

margin:0;

box-shadow:none;

}

}

@media(max-width:600px){

.cardHeader{

font-size:18px;

}

.cardBody{

padding:8px;

}

.infoArea{

padding:8px;

}

.infoArea h3{

font-size:15px;

}

.infoLabel{

min-width:65px;

font-size:12px;

}

.infoInput{

font-size:12px;

}

}

</style>

</head>


<body>


<h2>🪪 RG Digital ID Card Creator</h2>


<div class="controls">

<input
id="name"
placeholder="Name">

<input
id="idnumber"
placeholder="ID Number">

<input
id="dob"
placeholder="DOB">

<br>

<button
onclick="updateCard()">

✏️ Update Card

</button>


<button
class="print"
onclick="window.print()">

🖨️ Print ID Card

</button>


<button
onclick="downloadCard()">

⬇️ Download ID Card

</button>

</div>


<div
class="card"
id="idCard">


<div class="cardHeader">

RG DIGITAL ID CARD

</div>


<div class="cardBody">


<div class="photoArea">

<img
id="cardPhoto"
src="${imageData}">

</div>


<div class="infoArea">

<h3>Identity Card</h3>


<div class="infoRow">

<span class="infoLabel">
Name:
</span>

<span id="showName">
-
</span>

</div>


<div class="infoRow">

<span class="infoLabel">
ID Number:
</span>

<span id="showID">
-
</span>

</div>


<div class="infoRow">

<span class="infoLabel">
DOB:
</span>

<span id="showDOB">
-
</span>

</div>


</div>

</div>


<div class="footer">

Developed by Rameshwar Namdev Ghungrad

</div>


</div>


<script>

function updateCard(){

document.getElementById(
"showName"
).textContent=

document.getElementById(
"name"
).value || "-";


document.getElementById(
"showID"
).textContent=

document.getElementById(
"idnumber"
).value || "-";


document.getElementById(
"showDOB"
).textContent=

document.getElementById(
"dob"
).value || "-";

}


async function downloadCard(){

const card=
document.getElementById(
"idCard"
);


const canvas=
document.createElement(
"canvas"
);


const scale=2;


const width=856;

const height=
Math.round(
width/1.586
);


canvas.width=
width*scale;

canvas.height=
height*scale;


const ctx=
canvas.getContext(
"2d"
);


ctx.fillStyle=
"white";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);


/*
Simple card image export.
*/

const cardImage=
new Image();

cardImage.crossOrigin="anonymous";


const photo=
document.getElementById(
"cardPhoto"
);


cardImage.onload=
function(){

ctx.drawImage(
photo,
50*scale,
150*scale,
280*scale,
300*scale
);


ctx.fillStyle=
"#1e3a8a";

ctx.font=
"bold 32px Arial";

ctx.fillText(
"RG DIGITAL ID CARD",
360*scale,
90*scale
);


ctx.fillStyle=
"#172033";

ctx.font=
"bold 20px Arial";

ctx.fillText(
"Name: "+
(document.getElementById("name").value || "-"),
360*scale,
180*scale
);


ctx.fillText(
"ID Number: "+
(document.getElementById("idnumber").value || "-"),
360*scale,
230*scale
);


ctx.fillText(
"DOB: "+
(document.getElementById("dob").value || "-"),
360*scale,
280*scale
);


ctx.font=
"14px Arial";

ctx.fillStyle=
"#64748b";

ctx.fillText(
"Developed by Rameshwar Namdev Ghungrad",
270*scale,
500*scale
);


canvas.toBlob(
function(blob){

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;

a.download=
"RG-Digital-ID-Card.jpg";

a.click();

URL.revokeObjectURL(url);

},
"image/jpeg",
0.95
);

};


cardImage.src=
photo.src;

}

</script>


</body>

</html>

`);

win.document.close();

};

reader.readAsDataURL(blob);

}

</script>

</body>
</html>
