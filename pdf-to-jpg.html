<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF to JPG | RG Digital</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#eef2ff,#f8fafc,#e0f2fe);
    color:#172033;
}

header{
    background:linear-gradient(135deg,#111827,#1e3a8a,#312e81);
    color:white;
    text-align:center;
    padding:30px 15px;
    box-shadow:0 5px 20px #0003;
}

header h1{
    margin:0;
    font-size:30px;
}

header p{
    margin:8px 0 0;
    opacity:.9;
}

.container{
    max-width:900px;
    margin:25px auto;
    padding:15px;
}

.card{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 8px 30px #0002;
}

.upload{
    border:2px dashed #64748b;
    border-radius:15px;
    padding:30px 20px;
    text-align:center;
    background:#f8fafc;
}

.upload h2{
    margin-top:0;
}

input[type="file"]{
    max-width:100%;
    margin:15px 0;
}

.password-box{
    display:none;
    margin-top:20px;
    padding:20px;
    border-radius:14px;
    background:#f8fafc;
    border:1px solid #dbeafe;
}

.password-box h3{
    margin-top:0;
}

.password-box input{
    width:100%;
    padding:13px;
    border:1px solid #cbd5e1;
    border-radius:9px;
    font-size:16px;
    outline:none;
}

.password-box input:focus{
    border-color:#2563eb;
}

button{
    border:none;
    border-radius:10px;
    padding:13px 20px;
    margin:8px 5px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    background:#1e3a8a;
    color:white;
}

button:hover{
    opacity:.9;
}

button:disabled{
    background:#94a3b8;
    cursor:not-allowed;
}

.center{
    text-align:center;
}

.status{
    text-align:center;
    margin:20px 0;
    font-weight:bold;
    min-height:22px;
}

.success{
    color:#15803d;
}

.error{
    color:#dc2626;
}

.info{
    color:#475569;
}

.pages{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    margin-top:25px;
}

.page{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:14px;
    padding:12px;
    text-align:center;
}

.page img{
    display:block;
    width:100%;
    height:auto;
    border-radius:8px;
    box-shadow:0 3px 12px #0002;
}

.page-name{
    font-weight:bold;
    margin:5px 0 12px;
}

.download-btn{
    background:#15803d;
    padding:10px 15px;
    font-size:14px;
}

footer{
    text-align:center;
    padding:25px 15px;
    color:#64748b;
    font-size:14px;
}

@media(max-width:650px){

    header h1{
        font-size:25px;
    }

    .card{
        padding:16px;
    }

    .pages{
        grid-template-columns:1fr;
    }

    button{
        width:100%;
        margin:6px 0;
    }
}
</style>
</head>

<body>

<header>
    <h1>📄 PDF to JPG</h1>
    <p>Convert PDF Pages into JPG Images</p>
</header>


<div class="container">

<div class="card">

    <div class="upload">

        <h2>📁 Select PDF File</h2>

        <input
            type="file"
            id="pdfFile"
            accept="application/pdf,.pdf">

        <p>Select a normal or password-protected PDF.</p>

    </div>


    <!-- PASSWORD BOX -->

    <div
        id="passwordBox"
        class="password-box">

        <h3>🔐 PDF Password Required</h3>

        <p id="passwordMessage">
            This PDF is password protected.
            Enter the correct password to continue.
        </p>

        <input
            type="password"
            id="passwordInput"
            placeholder="Enter PDF password"
            autocomplete="off">

        <div class="center">

            <button id="passwordButton">
                🔓 Open PDF
            </button>

        </div>

    </div>


    <div class="center">

        <button
            id="convertButton"
            disabled>
            🖼️ Convert PDF to JPG
        </button>

        <button
            id="downloadAllButton"
            disabled>
            ⬇️ Download All JPG
        </button>

    </div>


    <div
        id="status"
        class="status">
    </div>


    <div
        id="pages"
        class="pages">
    </div>

</div>

</div>


<footer>
    RG Digital Image Tools
</footer>


<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";


pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


const fileInput =
document.getElementById("pdfFile");

const passwordBox =
document.getElementById("passwordBox");

const passwordInput =
document.getElementById("passwordInput");

const passwordButton =
document.getElementById("passwordButton");

const passwordMessage =
document.getElementById("passwordMessage");

const convertButton =
document.getElementById("convertButton");

const downloadAllButton =
document.getElementById("downloadAllButton");

const status =
document.getElementById("status");

const pagesContainer =
document.getElementById("pages");


let pdfBytes = null;

let pdfDoc = null;

let convertedImages = [];


/* ---------------------------------
   STATUS
--------------------------------- */

function showStatus(message,type="info"){

    status.className =
    "status " + type;

    status.textContent =
    message;
}


/* ---------------------------------
   PDF FILE SELECT
--------------------------------- */

fileInput.addEventListener(
"change",
async function(){

    const file =
    this.files[0];

    if(!file){
        return;
    }


    resetPage();


    showStatus(
        "⏳ Loading PDF...",
        "info"
    );


    try{

        pdfBytes =
        new Uint8Array(
            await file.arrayBuffer()
        );


        /*
        First try WITHOUT password.
        */

        await loadPDF();


    }
    catch(error){

        console.log(
            "PDF loading error:",
            error
        );


        /*
        Password protected PDF
        */

        if(
            error &&
            (
                error.name ===
                "PasswordException" ||

                error.code ===
                pdfjsLib.PasswordResponses.NEED_PASSWORD ||

                error.code ===
                pdfjsLib.PasswordResponses.INCORRECT_PASSWORD
            )
        ){

            showPasswordBox();

        }
        else{

            showStatus(
                "❌ Could not open PDF. Please select a valid PDF file.",
                "error"
            );

        }

    }

});


/* ---------------------------------
   SHOW PASSWORD BOX
--------------------------------- */

function showPasswordBox(){

    passwordBox.style.display =
    "block";

    passwordInput.value = "";

    passwordMessage.textContent =
    "This PDF is password protected. Enter the correct password to continue.";

    showStatus(
        "🔐 Password required",
        "error"
    );

    passwordInput.focus();

}


/* ---------------------------------
   PASSWORD BUTTON
--------------------------------- */

passwordButton.addEventListener(
"click",
async function(){

    const enteredPassword =
    passwordInput.value;


    if(!enteredPassword){

        showStatus(
            "⚠️ Please enter the PDF password.",
            "error"
        );

        passwordInput.focus();

        return;
    }


    passwordButton.disabled =
    true;


    showStatus(
        "⏳ Checking password...",
        "info"
    );


    try{

        /*
        Load PDF using password.
        */

        await loadPDF(
            enteredPassword
        );


        passwordBox.style.display =
        "none";


        showStatus(
            "✅ PDF opened successfully.",
            "success"
        );


    }
    catch(error){

        console.log(
            "Password error:",
            error
        );


        if(
            error &&
            error.name ===
            "PasswordException"
        ){

            showStatus(
                "❌ Wrong password. Please enter the correct password.",
                "error"
            );

            passwordInput.select();

        }
        else{

            showStatus(
                "❌ PDF could not be opened.",
                "error"
            );

        }

    }


    passwordButton.disabled =
    false;

});


/* ---------------------------------
   ENTER KEY
--------------------------------- */

passwordInput.addEventListener(
"keydown",
function(event){

    if(event.key === "Enter"){

        passwordButton.click();

    }

});


/* ---------------------------------
   LOAD PDF
--------------------------------- */

function loadPDF(password=null){

    return new Promise(
    function(resolve,reject){

        let passwordUsed =
        false;


        const loadingTask =
        pdfjsLib.getDocument({

            data:pdfBytes,

            /*
            Important for encrypted PDFs.
            */

            disableAutoFetch:false,

            disableStream:false,

            onProgress:function(progress){

                if(
                    progress.total
                ){

                    const percent =
                    Math.round(
                        (
                            progress.loaded /
                            progress.total
                        ) * 100
                    );

                    showStatus(
                        "⏳ Loading PDF "+percent+"%",
                        "info"
                    );

                }

            },

            /*
            Correct PDF.js password callback.
            */

            password: function(
                callback,
                reason
            ){

                console.log(
                    "Password callback reason:",
                    reason
                );


                /*
                Password is already supplied.
                */

                if(password){

                    passwordUsed =
                    true;

                    callback(password);

                    return;
                }


                /*
                PDF needs password.
                */

                reject({

                    name:
                    "PasswordException",

                    code:
                    reason

                });

            }

        });


        loadingTask.promise.then(

            function(pdf){

                pdfDoc =
                pdf;

                convertButton.disabled =
                false;

                resolve(pdf);

            },

            function(error){

                reject(error);

            }

        );

    });

}


/* ---------------------------------
   CONVERT PDF TO JPG
--------------------------------- */

convertButton.addEventListener(
"click",
async function(){

    if(!pdfDoc){
        return;
    }


    convertButton.disabled =
    true;

    downloadAllButton.disabled =
    true;


    pagesContainer.innerHTML =
    "";

    convertedImages =
    [];


    showStatus(
        "⏳ Starting conversion...",
        "info"
    );


    try{

        for(
            let pageNumber=1;
            pageNumber<=pdfDoc.numPages;
            pageNumber++
        ){

            showStatus(
                "⏳ Converting page "+
                pageNumber+
                " of "+
                pdfDoc.numPages+
                "...",
                "info"
            );


            const page =
            await pdfDoc.getPage(
                pageNumber
            );


            /*
            High quality rendering.
            */

            const scale =
            2;


            const viewport =
            page.getViewport({
                scale:scale
            });


            const canvas =
            document.createElement(
                "canvas"
            );


            const context =
            canvas.getContext(
                "2d",
                {
                    alpha:false
                }
            );


            canvas.width =
            Math.floor(
                viewport.width
            );

            canvas.height =
            Math.floor(
                viewport.height
            );


            await page.render({

                canvasContext:
                context,

                viewport:
                viewport

            }).promise;


            /*
            Convert canvas to JPG.
            */

            const blob =
            await canvasToJPG(
                canvas
            );


            if(!blob){

                throw new Error(
                    "JPG conversion failed"
                );

            }


            convertedImages.push(
                blob
            );


            createPreview(
                blob,
                pageNumber
            );

        }


        showStatus(
            "✅ All PDF pages converted successfully.",
            "success"
        );


        downloadAllButton.disabled =
        false;


    }
    catch(error){

        console.error(
            error
        );


        showStatus(
            "❌ Conversion failed.",
            "error"
        );

    }


    convertButton.disabled =
    false;

});


/* ---------------------------------
   CANVAS TO JPG
--------------------------------- */

function canvasToJPG(canvas){

    return new Promise(
    function(resolve){

        canvas.toBlob(
            function(blob){

                resolve(blob);

            },
            "image/jpeg",
            0.95
        );

    });

}


/* ---------------------------------
   CREATE PREVIEW
--------------------------------- */

function createPreview(
    blob,
    pageNumber
){

    const url =
    URL.createObjectURL(
        blob
    );


    const box =
    document.createElement(
        "div"
    );

    box.className =
    "page";


    const title =
    document.createElement(
        "div"
    );

    title.className =
    "page-name";

    title.textContent =
    "Page "+pageNumber;


    const image =
    document.createElement(
        "img"
    );

    image.src =
    url;


    const button =
    document.createElement(
        "button"
    );

    button.className =
    "download-btn";

    button.textContent =
    "⬇️ Download JPG";


    button.addEventListener(
        "click",
        function(){

            downloadBlob(
                blob,
                "page-"+pageNumber+".jpg"
            );

        }
    );


    box.appendChild(
        title
    );

    box.appendChild(
        image
    );

    box.appendChild(
        button
    );


    pagesContainer.appendChild(
        box
    );

}


/* ---------------------------------
   DOWNLOAD SINGLE
--------------------------------- */

function downloadBlob(
    blob,
    filename
){

    const url =
    URL.createObjectURL(
        blob
    );


    const link =
    document.createElement(
        "a"
    );


    link.href =
    url;

    link.download =
    filename;


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    setTimeout(
        function(){

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );

}


/* ---------------------------------
   DOWNLOAD ALL
--------------------------------- */

downloadAllButton.addEventListener(
"click",
async function(){

    if(
        convertedImages.length === 0
    ){
        return;
    }


    downloadAllButton.disabled =
    true;


    showStatus(
        "⏳ Starting downloads...",
        "info"
    );


    for(
        let i=0;
        i<convertedImages.length;
        i++
    ){

        downloadBlob(
            convertedImages[i],
            "page-"+(i+1)+".jpg"
        );


        /*
        Small delay so browser
        does not block downloads.
        */

        await sleep(500);

    }


    showStatus(
        "✅ All JPG downloads started.",
        "success"
    );


    downloadAllButton.disabled =
    false;

});


/* ---------------------------------
   RESET
--------------------------------- */

function resetPage(){

    pdfDoc =
    null;

    convertedImages =
    [];

    pagesContainer.innerHTML =
    "";

    passwordBox.style.display =
    "none";

    passwordInput.value =
    "";

    convertButton.disabled =
    true;

    downloadAllButton.disabled =
    true;

}


/* ---------------------------------
   SLEEP
--------------------------------- */

function sleep(ms){

    return new Promise(
        function(resolve){

            setTimeout(
                resolve,
                ms
            );

        }
    );

}

</script>

</body>
</html>
