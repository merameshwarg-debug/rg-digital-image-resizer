<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PDF to JPG - RG Digital</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(135deg,#eef2ff,#f8fafc,#e0f2fe);
color:#172033
}

header{
background:linear-gradient(135deg,#111827,#1e3a8a,#312e81);
color:white;
text-align:center;
padding:28px 15px;
box-shadow:0 5px 20px #0003
}

header h1{
margin:0;
font-size:30px
}

header p{
margin:8px 0 0;
opacity:.9
}

.container{
max-width:900px;
margin:25px auto;
padding:15px
}

.card{
background:white;
padding:24px;
border-radius:18px;
box-shadow:0 8px 30px #0002
}

.upload{
border:2px dashed #888;
border-radius:12px;
padding:28px;
text-align:center
}

input[type=file]{
max-width:100%;
margin:15px
}

.passwordBox{
display:none;
margin-top:20px;
padding:20px;
background:#f8fafc;
border-radius:12px;
border:1px solid #ddd
}

.passwordBox input{
width:100%;
padding:13px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px
}

button{
border:0;
background:#111827;
color:white;
padding:13px 20px;
border-radius:9px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin:8px
}

button:disabled{
background:#aaa;
cursor:not-allowed
}

.center{
text-align:center
}

.status{
text-align:center;
font-weight:bold;
margin:18px
}

.success{
color:#16803c
}

.error{
color:#c62828
}

.pages{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:18px;
margin-top:25px
}

.page{
border:1px solid #ddd;
border-radius:12px;
padding:12px;
background:#fafafa;
text-align:center
}

.page img{
max-width:100%;
height:auto;
border-radius:7px;
box-shadow:0 3px 10px #0002
}

.page button{
font-size:14px;
padding:10px 15px
}

@media(max-width:650px){

.pages{
grid-template-columns:1fr
}

.card{
padding:16px
}

header h1{
font-size:25px
}

}
</style>
</head>

<body>

<header>

<h1>📄 PDF to JPG</h1>

<p>Convert PDF Pages into JPG Images</p>

</header>


<div class="container">

<div class="card">

<div class="upload">

<h2>📁 Select PDF</h2>

<input
type="file"
id="pdfFile"
accept=".pdf,application/pdf">

<p>PDF files only</p>

</div>


<!-- PASSWORD -->

<div
id="passwordBox"
class="passwordBox">

<h3>🔐 Password Protected PDF</h3>

<p>
This PDF is protected with a password.
Enter the correct password to continue.
</p>

<input
type="password"
id="password"
placeholder="Enter PDF Password"
autocomplete="off">

<div class="center">

<button id="openBtn">
🔓 Open PDF
</button>

</div>

</div>


<div class="center">

<button
id="convertBtn"
disabled>

🖼️ Convert PDF to JPG

</button>

<button
id="downloadAll"
disabled>

⬇️ Download All

</button>

</div>


<div
id="status"
class="status">
</div>


<div
id="pages"
class="pages">
</div>


</div>

</div>


<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";


pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


const pdfFile =
document.getElementById("pdfFile");

const passwordBox =
document.getElementById("passwordBox");

const passwordInput =
document.getElementById("password");

const openBtn =
document.getElementById("openBtn");

const convertBtn =
document.getElementById("convertBtn");

const downloadAll =
document.getElementById("downloadAll");

const status =
document.getElementById("status");

const pages =
document.getElementById("pages");


let selectedFile = null;

let pdfBytes = null;

let pdfDocument = null;

let convertedImages = [];


/* SELECT PDF */

pdfFile.addEventListener(
"change",
async function(){

selectedFile = this.files[0];

if(!selectedFile){
return;
}

passwordBox.style.display="none";

convertBtn.disabled=true;

downloadAll.disabled=true;

pages.innerHTML="";

convertedImages=[];

status.textContent=
"⏳ Checking PDF...";


try{

pdfBytes =
new Uint8Array(
await selectedFile.arrayBuffer()
);


/*
First attempt without password.
*/

pdfDocument =
await openPDF();


passwordBox.style.display="none";

convertBtn.disabled=false;

status.innerHTML =
'<span class="success">'+
"✅ PDF opened successfully"+
"</span>";


}
catch(error){

console.log(error);


/*
Password protected PDF
*/

if(
error &&
(
error.name==="PasswordException" ||
error.code===1 ||
error.code===2
)
){

passwordBox.style.display="block";

status.innerHTML =
'<span class="error">'+
"🔐 Password required"+
"</span>";

passwordInput.focus();

}
else{

status.innerHTML =
'<span class="error">'+
"❌ Could not open PDF"+
"</span>";

}

}

});


/* OPEN PASSWORD PDF */

openBtn.addEventListener(
"click",
async function(){

const pass =
passwordInput.value;

if(!pass){

status.innerHTML =
'<span class="error">'+
"Please enter PDF password"+
"</span>";

passwordInput.focus();

return;

}

openBtn.disabled=true;

status.textContent =
"⏳ Checking password...";


try{

pdfDocument =
await openPDF(pass);


passwordBox.style.display="none";

convertBtn.disabled=false;

status.innerHTML =
'<span class="success">'+
"✅ Correct password. PDF opened."+
"</span>";

}
catch(error){

console.log(error);

status.innerHTML =
'<span class="error">'+
"❌ Wrong password. Please try again."+
"</span>";

passwordInput.select();

openBtn.disabled=false;

}

});


/* ENTER KEY */

passwordInput.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

openBtn.click();

}

});


/* OPEN PDF FUNCTION */

function openPDF(pass){

return new Promise(
(resolve,reject)=>{

let task =
pdfjsLib.getDocument({

data:pdfBytes,

isEvalSupported:true,

useWorkerFetch:true,

onProgress:
function(progress){

if(progress.total){

const percent =
Math.round(
progress.loaded /
progress.total * 100
);

status.textContent =
"⏳ Loading PDF "+
percent+"%";

}

},

onPassword:
function(callback,reason){

/*
Reason 1 = NEED_PASSWORD
Reason 2 = INCORRECT_PASSWORD
*/

if(pass){

callback(pass);

}
else{

reject({
name:"PasswordException",
code:reason
});

}

}

});


task.promise.then(
resolve,
reject
);

});

}


/* CONVERT PDF */

convertBtn.addEventListener(
"click",
async function(){

if(!pdfDocument){
return;
}

convertBtn.disabled=true;

downloadAll.disabled=true;

pages.innerHTML="";

convertedImages=[];

status.textContent =
"⏳ Converting PDF to JPG...";


try{

for(
let i=1;
i<=pdfDocument.numPages;
i++
){

status.textContent =
"⏳ Converting page "+
i+" of "+
pdfDocument.numPages;


const page =
await pdfDocument.getPage(i);


/*
High quality
*/

const scale=2;

const viewport =
page.getViewport({
scale:scale
});


const canvas =
document.createElement("canvas");

const context =
canvas.getContext("2d");


canvas.width =
Math.floor(viewport.width);

canvas.height =
Math.floor(viewport.height);


await page.render({

canvasContext:context,

viewport:viewport

}).promise;


/*
JPG conversion
*/

const blob =
await new Promise(
resolve=>{

canvas.toBlob(
resolve,
"image/jpeg",
0.95
);

});


convertedImages.push(blob);


/*
Preview
*/

const url =
URL.createObjectURL(blob);

const box =
document.createElement("div");

box.className="page";


const title =
document.createElement("p");

title.innerHTML =
"<b>Page "+i+"</b>";


const img =
document.createElement("img");

img.src=url;


const btn =
document.createElement("button");

btn.textContent =
"⬇️ Download JPG";

btn.onclick =
function(){

downloadBlob(
blob,
"page-"+i+".jpg"
);

};


box.appendChild(title);

box.appendChild(img);

box.appendChild(btn);

pages.appendChild(box);

}


status.innerHTML =
'<span class="success">'+
"✅ PDF converted successfully"+
"</span>";

downloadAll.disabled=false;

}
catch(error){

console.error(error);

status.innerHTML =
'<span class="error">'+
"❌ Conversion failed"+
"</span>";

}

convertBtn.disabled=false;

});


/* DOWNLOAD ALL */

downloadAll.addEventListener(
"click",
async function(){

if(!convertedImages.length){
return;
}

downloadAll.disabled=true;

status.textContent =
"⏳ Starting downloads...";


for(
let i=0;
i<convertedImages.length;
i++
){

downloadBlob(
convertedImages[i],
"page-"+(i+1)+".jpg"
);

await new Promise(
resolve=>
setTimeout(resolve,500)
);

}


status.innerHTML =
'<span class="success">'+
"✅ All JPG downloads started"+
"</span>";

downloadAll.disabled=false;

});


/* DOWNLOAD */

function downloadBlob(
blob,
filename
){

const url =
URL.createObjectURL(blob);

const a =
document.createElement("a");

a.href=url;

a.download=filename;

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(
function(){

URL.revokeObjectURL(url);

},
1500
);

}

</script>

</body>
</html>
