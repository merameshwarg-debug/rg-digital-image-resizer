<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RG Digital AI Background Remover</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fb;
color:#172033
}

header{
background:#111827;
color:white;
text-align:center;
padding:24px 15px
}

header h1{
margin:0;
font-size:30px
}

header p{
margin:8px 0
}

.container{
max-width:950px;
margin:25px auto;
padding:15px
}

.card{
background:white;
padding:22px;
border-radius:16px;
box-shadow:0 5px 20px #0001
}

.upload{
border:2px dashed #888;
padding:28px;
border-radius:12px;
text-align:center
}

input[type=file]{
max-width:100%;
margin:12px
}

.controls{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:18px
}

.box{
border:1px solid #ddd;
padding:15px;
border-radius:10px
}

select,input[type=color]{
width:100%;
padding:11px;
border:1px solid #ccc;
border-radius:8px;
margin-top:8px
}

input[type=color]{
height:45px;
padding:3px
}

button{
border:0;
background:#111827;
color:white;
padding:14px 20px;
border-radius:9px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin:8px
}

button:disabled{
background:#aaa
}

.preview{
margin-top:20px;
min-height:300px;
border-radius:12px;
padding:20px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;

background-image:
linear-gradient(45deg,#ddd 25%,transparent 25%),
linear-gradient(-45deg,#ddd 25%,transparent 25%),
linear-gradient(45deg,transparent 75%,#ddd 75%),
linear-gradient(-45deg,transparent 75%,#ddd 75%);

background-size:24px 24px;

background-position:
0 0,
0 12px,
12px -12px,
-12px 0
}

.preview img{
max-width:100%;
max-height:550px;
display:block
}

.status{
text-align:center;
font-weight:bold;
margin:18px
}

.success{
color:#16803c
}

.error{
color:#c62828
}

.actions{
text-align:center
}

.info{
background:#f3f4f6;
padding:12px;
border-radius:8px;
margin-top:12px;
text-align:center
}

@media(max-width:700px){

.controls{
grid-template-columns:1fr
}

.card{
padding:15px
}

}
</style>
</head>

<body>

<header>

<h1>✂️ AI Background Remover</h1>

<p>Clean Background • Natural Edges • Change Background</p>

</header>


<div class="container">

<div class="card">


<div class="upload">

<h2>📸 Select Image</h2>

<input
type="file"
id="file"
accept="image/jpeg,image/png,image/webp">

<p>JPG • PNG • WEBP</p>

</div>


<div class="controls">


<div class="box">

<b>⚡ Processing Mode</b>

<select id="model">

<option value="isnet_quint8">
Fast Mode
</option>

<option value="isnet">
High Quality
</option>

</select>

</div>


<div class="box">

<b>🎨 Background Color</b>

<select id="bg">

<option value="transparent">
Transparent
</option>

<option value="#ffffff">
White
</option>

<option value="#000000">
Black
</option>

<option value="#0000ff">
Blue
</option>

<option value="#008000">
Green
</option>

<option value="#ff0000">
Red
</option>

<option value="#ffff00">
Yellow
</option>

<option value="#808080">
Gray
</option>

<option value="custom">
Custom Color
</option>

</select>

<input
type="color"
id="customColor"
value="#ffffff">

</div>


<div class="box">

<b>✂️ Edge Strength</b>

<select id="edge">

<option value="light">
Light - More Hair
</option>

<option value="medium" selected>
Medium - Recommended
</option>

<option value="strong">
Strong - Cleaner Edge
</option>

</select>

</div>


<div class="box">

<b>🔍 Edge Softness</b>

<select id="softness">

<option value="0">
None
</option>

<option value="1" selected>
Normal
</option>

<option value="2">
Extra Smooth
</option>

</select>

</div>

</div>


<div style="text-align:center">

<button id="remove" disabled>
✨ Remove Background
</button>

</div>


<div id="status" class="status"></div>


<h3>Original Image</h3>

<div class="preview">

<img
id="original"
style="display:none">

<span id="originalText">
Selected image will appear here
</span>

</div>


<h3>Result</h3>

<div class="preview">

<img
id="result"
style="display:none">

<span id="resultText">
Result will appear here
</span>

</div>


<div class="actions">

<button id="downloadPNG" disabled>
⬇️ Download PNG
</button>

<button id="downloadJPG" disabled>
⬇️ Download JPG
</button>

</div>


<div
id="sizeInfo"
class="info"
style="display:none">
</div>


</div>
</div>


<script type="module">

const fileInput=
document.getElementById("file");

const original=
document.getElementById("original");

const originalText=
document.getElementById("originalText");

const removeBtn=
document.getElementById("remove");

const status=
document.getElementById("status");

const result=
document.getElementById("result");

const resultText=
document.getElementById("resultText");

const downloadPNG=
document.getElementById("downloadPNG");

const downloadJPG=
document.getElementById("downloadJPG");

const bg=
document.getElementById("bg");

const customColor=
document.getElementById("customColor");

const modelSelect=
document.getElementById("model");

const edge=
document.getElementById("edge");

const softness=
document.getElementById("softness");

const sizeInfo=
document.getElementById("sizeInfo");


let selectedFile=null;

let transparentBlob=null;

let finalBlob=null;


/* SELECT IMAGE */

fileInput.addEventListener(
"change",
function(){

selectedFile=this.files[0];

if(!selectedFile){

removeBtn.disabled=true;

return;

}

const url=
URL.createObjectURL(selectedFile);

original.src=url;

original.style.display="block";

originalText.style.display="none";

result.style.display="none";

resultText.style.display="block";

downloadPNG.disabled=true;

downloadJPG.disabled=true;

sizeInfo.style.display="none";

status.innerHTML=
'<span class="success">'+
"✅ Image selected"+
"</span>";

removeBtn.disabled=false;

});


/* REMOVE BACKGROUND */

removeBtn.addEventListener(
"click",
async function(){

if(!selectedFile)return;

removeBtn.disabled=true;

downloadPNG.disabled=true;

downloadJPG.disabled=true;

status.textContent=
"⏳ Loading AI...";


try{

const library=
await import(
"https://esm.sh/@imgly/background-removal@1.7.0"
);

const removeBackground=
library.removeBackground;

if(
typeof removeBackground!=="function"
){

throw new Error(
"AI library failed to load."
);

}


status.textContent=
"⏳ AI processing...";


transparentBlob=
await removeBackground(
selectedFile,
{

model:modelSelect.value,

device:"cpu",

proxyToWorker:true,

output:{
format:"image/png",
quality:1
},

progress:
function(key,current,total){

if(total){

const p=
Math.round(
current/total*100
);

status.textContent=
"⏳ Processing "+p+"%";

}

}

}
);


status.textContent=
"⏳ Cleaning edges...";


await createCleanImage();


status.innerHTML=
'<span class="success">'+
"✅ Background removed successfully"+
"</span>";


}
catch(error){

console.error(error);

status.innerHTML=
'<span class="error">'+
"❌ Processing failed<br>"+
error.message+
"</span>";

}

removeBtn.disabled=false;

});


/* CREATE CLEAN IMAGE */

async function createCleanImage(){

const url=
URL.createObjectURL(
transparentBlob
);

const img=
await loadImage(url);

const w=img.naturalWidth;

const h=img.naturalHeight;


const canvas=
document.createElement("canvas");

canvas.width=w;

canvas.height=h;


const ctx=
canvas.getContext(
"2d",
{willReadFrequently:true}
);


ctx.clearRect(
0,
0,
w,
h
);


/*
IMPORTANT:
Use AI result directly.
No colour decontamination.
This prevents red/blue halos.
*/

ctx.drawImage(
img,
0,
0
);


const data=
ctx.getImageData(
0,
0,
w,
h
);


const px=data.data;


/*
EDGE CLEANUP
Only reduce very weak
semi-transparent pixels.
Do NOT change RGB colours.
*/

let strength=edge.value;

for(
let y=0;
y<h;
y++
){

for(
let x=0;
x<w;
x++
){

const i=
(y*w+x)*4;

let a=
px[i+3];


if(a<12){

px[i+3]=0;

continue;

}


/*
Strong mode removes weak edge pixels.
*/

if(strength==="strong"){

if(a<70){

px[i+3]=0;

}

}


/*
Medium mode.
*/

if(strength==="medium"){

if(a<35){

px[i+3]=0;

}

}


/*
Light mode keeps more hair.
*/

if(strength==="light"){

if(a<18){

px[i+3]=0;

}

}

}

}


ctx.putImageData(
data,
0,
0
);


/*
OPTIONAL SOFT EDGE
*/

if(softness.value!=="0"){

const amount=
parseInt(softness.value);

ctx.globalCompositeOperation=
"destination-in";

ctx.globalAlpha=
amount===2 ? 0.98 : 0.99;

ctx.drawImage(
canvas,
0,
0
);

ctx.globalCompositeOperation=
"source-over";

ctx.globalAlpha=1;

}


/*
CREATE FINAL BACKGROUND
*/

const finalCanvas=
document.createElement("canvas");

finalCanvas.width=w;

finalCanvas.height=h;

const fctx=
finalCanvas.getContext("2d");


let color=
bg.value;


if(color!=="transparent"){

if(color==="custom"){

color=
customColor.value;

}

fctx.fillStyle=color;

fctx.fillRect(
0,
0,
w,
h
);

}


fctx.drawImage(
canvas,
0,
0
);


/*
PNG
*/

finalCanvas.toBlob(
function(blob){

finalBlob=blob;

result.src=
URL.createObjectURL(blob);

result.style.display=
"block";

resultText.style.display=
"none";

downloadPNG.disabled=false;

downloadJPG.disabled=false;

sizeInfo.style.display=
"block";

sizeInfo.textContent=
"Final: "+
(blob.size/1024).toFixed(2)+
" KB • "+
w+" × "+h+" px";

},
"image/png"
);

}


/* IMAGE LOADER */

function loadImage(url){

return new Promise(
function(resolve,reject){

const img=
new Image();

img.onload=
function(){

resolve(img);

};

img.onerror=reject;

img.src=url;

});

}


/* CHANGE BACKGROUND */

bg.addEventListener(
"change",
function(){

if(transparentBlob){

createCleanImage();

}

});


customColor.addEventListener(
"input",
function(){

if(
transparentBlob &&
bg.value==="custom"
){

createCleanImage();

}

});


/* DOWNLOAD PNG */

downloadPNG.addEventListener(
"click",
function(){

if(!finalBlob)return;

downloadFile(
finalBlob,
"RG-Digital-Background-Removed.png"
);

});


/* DOWNLOAD JPG */

downloadJPG.addEventListener(
"click",
async function(){

if(!transparentBlob)return;

const url=
URL.createObjectURL(
transparentBlob
);

const img=
await loadImage(url);


const canvas=
document.createElement("canvas");

canvas.width=
img.naturalWidth;

canvas.height=
img.naturalHeight;

const ctx=
canvas.getContext("2d");


let color=
bg.value;


if(
color==="transparent"
){

color="#ffffff";

}

if(
color==="custom"
){

color=
customColor.value;

}


ctx.fillStyle=color;

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

ctx.drawImage(
img,
0,
0
);


canvas.toBlob(
function(blob){

downloadFile(
blob,
"RG-Digital-Background-Removed.jpg"
);

},
"image/jpeg",
0.95
);

});


/* DOWNLOAD */

function downloadFile(
blob,
name
){

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;

a.download=name;

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(
function(){

URL.revokeObjectURL(url);

},
1000
);

}

</script>

</body>
</html>
