<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Background Remover - RG Digital</title>

<meta name="description" content="Remove simple image backgrounds online for free.">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fb;
color:#222
}

header{
background:#111827;
color:#fff;
text-align:center;
padding:28px 15px
}

header h1{
margin:0;
font-size:30px
}

header p{
margin:8px 0 0
}

.container{
max-width:850px;
margin:25px auto;
padding:0 15px
}

.card{
background:#fff;
padding:25px;
border-radius:16px;
box-shadow:0 5px 20px #0001
}

.upload{
border:2px dashed #999;
padding:30px 15px;
border-radius:12px;
text-align:center
}

input[type=file]{
max-width:100%
}

.settings{
margin-top:20px
}

label{
font-weight:bold;
display:block;
margin-bottom:7px
}

input[type=range]{
width:100%
}

button{
background:#111827;
color:#fff;
border:0;
padding:13px 20px;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:18px
}

button:disabled{
background:#aaa;
cursor:not-allowed
}

.info{
background:#f3f4f6;
padding:15px;
border-radius:10px;
margin-top:18px
}

#result{
display:none;
text-align:center;
margin-top:25px
}

#preview{
max-width:100%;
max-height:500px;
border-radius:10px;
background-image:
linear-gradient(45deg,#ddd 25%,transparent 25%),
linear-gradient(-45deg,#ddd 25%,transparent 25%),
linear-gradient(45deg,transparent 75%,#ddd 75%),
linear-gradient(-45deg,transparent 75%,#ddd 75%);
background-size:20px 20px;
background-position:0 0,0 10px,10px -10px,-10px 0
}

.success{
color:#166534;
font-weight:bold;
margin-top:15px
}

.error{
color:#b91c1c;
font-weight:bold;
margin-top:15px
}

footer{
margin-top:30px;
background:#111827;
color:#fff;
text-align:center;
padding:22px
}
</style>
</head>

<body>

<header>

<h1>✂️ Background Remover</h1>

<p>Remove Simple Image Background Online</p>

</header>


<div class="container">

<div class="card">

<div class="upload">

<h2>📸 Select Image</h2>

<p>JPG, JPEG or PNG</p>

<input
type="file"
id="file"
accept="image/jpeg,image/png,image/webp">

</div>


<div class="settings">

<label>
Background Removal Strength:
<span id="strengthText">35</span>
</label>

<input
type="range"
id="strength"
min="10"
max="80"
value="35">

<p>
Lower value = remove only very similar background pixels.
<br>
Higher value = remove more background.
</p>

</div>


<button
id="removeBtn"
disabled>

Remove Background

</button>


<div id="status"></div>


<div id="result">

<h2>Result</h2>

<img
id="preview"
alt="Background removed image">

<br>

<button id="downloadBtn">
Download PNG
</button>

</div>

</div>

</div>


<footer>

© 2026 RG Digital Image Tools

</footer>


<script>

const fileInput =
document.getElementById("file");

const strength =
document.getElementById("strength");

const strengthText =
document.getElementById("strengthText");

const removeBtn =
document.getElementById("removeBtn");

const status =
document.getElementById("status");

const result =
document.getElementById("result");

const preview =
document.getElementById("preview");

const downloadBtn =
document.getElementById("downloadBtn");

let selectedFile=null;
let finalBlob=null;


/* STRENGTH */

strength.oninput=function(){

strengthText.textContent=this.value;

};


/* SELECT IMAGE */

fileInput.onchange=function(){

selectedFile=this.files[0];

if(!selectedFile){

removeBtn.disabled=true;

return;

}

removeBtn.disabled=false;

result.style.display="none";

status.innerHTML=
"Selected: "+selectedFile.name;

};


/* REMOVE BACKGROUND */

removeBtn.onclick=function(){

if(!selectedFile)return;

removeBtn.disabled=true;

status.innerHTML=
"⏳ Removing background... Please wait.";

const reader=new FileReader();

reader.onload=function(e){

const img=new Image();

img.onload=function(){

try{

const canvas=
document.createElement("canvas");

canvas.width=img.naturalWidth;
canvas.height=img.naturalHeight;

const ctx=
canvas.getContext("2d");

ctx.drawImage(
img,
0,
0
);

const imageData=
ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);

const data=imageData.data;


/*
Get corner background colors.
*/

const points=[
[0,0],
[canvas.width-1,0],
[0,canvas.height-1],
[canvas.width-1,canvas.height-1]
];

let bgR=0;
let bgG=0;
let bgB=0;

for(const p of points){

const i=
(p[1]*canvas.width+p[0])*4;

bgR+=data[i];
bgG+=data[i+1];
bgB+=data[i+2];

}

bgR/=4;
bgG/=4;
bgB/=4;


/*
Strength controls tolerance.
*/

const tolerance=
parseInt(strength.value);


/*
Remove pixels similar to background.
*/

for(
let y=0;
y<canvas.height;
y++
){

for(
let x=0;
x<canvas.width;
x++
){

const i=
(y*canvas.width+x)*4;

const r=data[i];
const g=data[i+1];
const b=data[i+2];

const distance=
Math.sqrt(
Math.pow(r-bgR,2)+
Math.pow(g-bgG,2)+
Math.pow(b-bgB,2)
);


/*
Higher tolerance removes
more similar pixels.
*/

const limit=
tolerance*4;

if(distance<limit){

data[i+3]=0;

}else if(distance<limit*1.35){

/*
Soft edge.
*/

const alpha=
Math.round(
255*
(
(distance-limit)/
(limit*.35)
)
);

data[i+3]=
Math.max(
0,
Math.min(
255,
alpha
)
);

}

}

}


ctx.putImageData(
imageData,
0,
0
);


/*
Create transparent PNG.
*/

canvas.toBlob(
function(blob){

if(!blob){

status.innerHTML=
'<div class="error">'+
"Unable to create PNG."+
"</div>";

removeBtn.disabled=false;

return;

}

finalBlob=blob;

preview.src=
URL.createObjectURL(blob);

result.style.display="block";

status.innerHTML=
'<div class="success">'+
"Background removed successfully! ✅"+
"</div>";

removeBtn.disabled=false;

},
"image/png"
);

}catch(error){

console.error(error);

status.innerHTML=
'<div class="error">'+
"Unable to process this image."+
"</div>";

removeBtn.disabled=false;

}

};

img.onerror=function(){

status.innerHTML=
'<div class="error">'+
"Invalid image."+
"</div>";

removeBtn.disabled=false;

};

img.src=e.target.result;

};

reader.readAsDataURL(selectedFile);

};


/* DOWNLOAD */

downloadBtn.onclick=function(){

if(!finalBlob)return;

const url=
URL.createObjectURL(finalBlob);

const a=
document.createElement("a");

a.href=url;

a.download=
"rg-digital-background-removed.png";

document.body.appendChild(a);

a.click();

document.body.removeChild(a);

setTimeout(
function(){
URL.revokeObjectURL(url);
},
1000
);

};

</script>

</body>
</html>
