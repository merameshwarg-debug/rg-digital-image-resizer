<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Background Remover - RG Digital</title>

<style>
body{margin:0;font-family:Arial;background:#f4f7fb;color:#222}
header{background:#111827;color:white;text-align:center;padding:25px}
.container{max-width:900px;margin:25px auto;padding:15px}
.card{background:white;padding:25px;border-radius:15px;box-shadow:0 5px 20px #0001}
.upload{border:2px dashed #888;padding:30px;text-align:center;border-radius:12px}
input{max-width:100%}
button{background:#111827;color:white;border:0;padding:14px 20px;border-radius:8px;font-weight:bold;margin-top:15px;cursor:pointer}
button:disabled{background:#aaa}
.preview{text-align:center;margin-top:20px;padding:20px;min-height:250px;background:#eee;border-radius:12px}
.preview img{max-width:100%;max-height:500px}
.status{text-align:center;font-weight:bold;margin:15px}
.success{color:green}
.error{color:red}
.download{text-align:center}
</style>
</head>

<body>

<header>
<h1>✂️ AI Background Remover</h1>
<p>Remove Background Automatically</p>
</header>

<div class="container">

<div class="card">

<div class="upload">

<h2>📸 Select Photo</h2>

<input
type="file"
id="file"
accept="image/jpeg,image/png,image/webp">

<p>पहिले फोटो select करा</p>

</div>

<div class="preview">

<img id="photoPreview" style="display:none">

<p id="previewText">
Selected image येथे दिसेल
</p>

</div>

<button id="removeBtn" disabled>
✨ Remove Background
</button>

<div id="status" class="status"></div>

<div class="download">

<img
id="result"
style="display:none;max-width:100%;max-height:500px">

<br>

<button id="downloadBtn" disabled>
⬇️ Download PNG
</button>

</div>

</div>
</div>


<script type="module">

const fileInput =
document.getElementById("file");

const photoPreview =
document.getElementById("photoPreview");

const previewText =
document.getElementById("previewText");

const removeBtn =
document.getElementById("removeBtn");

const status =
document.getElementById("status");

const result =
document.getElementById("result");

const downloadBtn =
document.getElementById("downloadBtn");

let selectedFile = null;
let outputBlob = null;


/* PHOTO SELECT */

fileInput.addEventListener("change",function(){

selectedFile=this.files[0];

if(!selectedFile){

removeBtn.disabled=true;
return;

}

const imageURL=
URL.createObjectURL(selectedFile);

photoPreview.src=imageURL;

photoPreview.style.display="block";

previewText.style.display="none";

removeBtn.disabled=false;

status.innerHTML=
"✅ Photo selected successfully.";

});


/* AI REMOVE */

removeBtn.addEventListener("click",async function(){

if(!selectedFile)return;

removeBtn.disabled=true;

downloadBtn.disabled=true;

status.innerHTML=
"⏳ AI Background Remover loading...";


try{

const module =
await import(
"https://esm.sh/@imgly/background-removal@1.7.0"
);

const removeBackground =
module.default;

status.innerHTML=
"⏳ AI model download होत आहे... पहिल्यांदा थोडा वेळ लागू शकतो.";


outputBlob =
await removeBackground(
selectedFile,
{
model:"isnet",
device:"cpu",
proxyToWorker:false,

output:{
format:"image/png",
quality:1
},

progress:function(
key,
current,
total
){

if(total){

const percent=
Math.round(
(current/total)*100
);

status.innerHTML=
"⏳ AI Processing: "+
percent+"%";

}

}

}
);


/* SHOW RESULT */

const resultURL=
URL.createObjectURL(outputBlob);

result.src=resultURL;

result.style.display="block";

status.innerHTML=
'<span class="success">'+
"✅ Background Successfully Removed!"+
"</span>";

downloadBtn.disabled=false;

}catch(error){

console.error(error);

status.innerHTML=
'<span class="error">'+
"❌ AI processing failed. Please try again."+
"<br><small>"+
error.message+
"</small></span>";

}

removeBtn.disabled=false;

});


/* DOWNLOAD */

downloadBtn.addEventListener("click",function(){

if(!outputBlob)return;

const url=
URL.createObjectURL(outputBlob);

const a=
document.createElement("a");

a.href=url;

a.download=
"RG-Digital-Background-Removed.png";

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(function(){

URL.revokeObjectURL(url);

},1000);

});

</script>

</body>
</html>
