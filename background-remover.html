<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RG Digital Background Remover</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}
header{background:#111827;color:white;text-align:center;padding:22px}
header h1{margin:0;font-size:28px}
.container{max-width:850px;margin:25px auto;padding:15px}
.card{background:white;padding:22px;border-radius:15px;box-shadow:0 4px 20px #0001}
.upload{border:2px dashed #999;border-radius:12px;padding:25px;text-align:center}
input[type=file]{max-width:100%;margin:15px}
button,select,input[type=color]{padding:13px;border-radius:8px}
button{border:0;background:#111827;color:white;font-size:16px;font-weight:bold;cursor:pointer;margin:10px}
button:disabled{background:#aaa}
select{border:1px solid #ccc;width:100%;margin-top:8px}
input[type=color]{width:100%;height:48px;border:1px solid #ccc;margin-top:8px}
.preview{margin-top:15px;min-height:280px;border-radius:12px;padding:15px;display:flex;align-items:center;justify-content:center;overflow:hidden;
background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);
background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}
.preview img{max-width:100%;max-height:550px}
.status{text-align:center;font-weight:bold;margin:15px}
.success{color:#16803c}.error{color:#c62828}
.center{text-align:center}
</style>
</head>

<body>

<header>
<h1>✂️ RG Digital Background Remover</h1>
<p>Remove Background & Change Colour</p>
</header>

<div class="container">
<div class="card">

<div class="upload">
<h2>📸 Select Photo</h2>
<input type="file" id="file" accept="image/jpeg,image/png,image/webp">
</div>

<div class="center">
<button id="remove" disabled>
✨ Remove Background
</button>
</div>

<div id="status" class="status"></div>

<h3>Selected Image</h3>

<div class="preview">
<img id="original" style="display:none">
<span id="originalText">Photo will appear here</span>
</div>

<h3>Background Colour</h3>

<select id="bg">
<option value="transparent">Transparent</option>
<option value="#ffffff">White</option>
<option value="#000000">Black</option>
<option value="#0000ff">Blue</option>
<option value="#008000">Green</option>
<option value="#ff0000">Red</option>
<option value="#ffff00">Yellow</option>
<option value="#808080">Gray</option>
<option value="custom">Custom Colour</option>
</select>

<input type="color" id="custom" value="#ffffff">

<h3>Result</h3>

<div class="preview">
<img id="result" style="display:none">
<span id="resultText">Result will appear here</span>
</div>

<div class="center">
<button id="download" disabled>
⬇️ Download Image
</button>
</div>

</div>
</div>

<script type="module">

const fileInput=document.getElementById("file");
const removeBtn=document.getElementById("remove");
const original=document.getElementById("original");
const originalText=document.getElementById("originalText");
const result=document.getElementById("result");
const resultText=document.getElementById("resultText");
const status=document.getElementById("status");
const bg=document.getElementById("bg");
const custom=document.getElementById("custom");
const download=document.getElementById("download");

let file=null;
let cutout=null;
let finalBlob=null;


/* SELECT PHOTO */

fileInput.onchange=()=>{

file=fileInput.files[0];

if(!file)return;

original.src=URL.createObjectURL(file);
original.style.display="block";
originalText.style.display="none";

removeBtn.disabled=false;
result.style.display="none";
resultText.style.display="block";
download.disabled=true;

status.textContent="✅ Photo selected";

};


/* REMOVE BACKGROUND */

removeBtn.onclick=async()=>{

if(!file)return;

removeBtn.disabled=true;
status.textContent="⏳ Removing background...";

try{

const lib=await import(
"https://esm.sh/@imgly/background-removal@1.7.0"
);

const removeBackground=lib.removeBackground;

if(typeof removeBackground!=="function")
throw new Error("AI engine could not load.");


/*
AI MASK ONLY.
Do not modify object colours.
*/

cutout=await removeBackground(
file,
{
model:"isnet",
device:"cpu",
proxyToWorker:true,

output:{
format:"image/png",
quality:1
},

progress:(key,current,total)=>{

if(total){

status.textContent=
"⏳ Processing "+
Math.round(current/total*100)+
"%";

}

}

});


status.textContent="⏳ Finalising clean edges...";

await renderResult();

status.innerHTML=
'<span class="success">✅ Background Removed</span>';

}
catch(e){

console.error(e);

status.innerHTML=
'<span class="error">❌ '+e.message+'</span>';

}

removeBtn.disabled=false;

};


/* RENDER RESULT */

async function renderResult(){

const img=await loadImage(
URL.createObjectURL(cutout)
);

const canvas=document.createElement("canvas");

canvas.width=img.naturalWidth;
canvas.height=img.naturalHeight;

const ctx=canvas.getContext(
"2d",
{willReadFrequently:true}
);


/*
Draw transparent AI result.
NO colour replacement.
NO aggressive shrinking.
*/

ctx.clearRect(
0,0,
canvas.width,
canvas.height
);

ctx.drawImage(img,0,0);


/*
Only remove almost invisible pixels.
This prevents a visible halo without
cutting the actual object.
*/

const imageData=ctx.getImageData(
0,0,
canvas.width,
canvas.height
);

const p=imageData.data;

for(let i=3;i<p.length;i+=4){

if(p[i]<8)p[i]=0;

}


/*
Very weak isolated edge pixels only.
Object colours remain untouched.
*/

for(
let y=1;
y<canvas.height-1;
y++
){

for(
let x=1;
x<canvas.width-1;
x++
){

const i=(y*canvas.width+x)*4;

if(
p[i+3]>8 &&
p[i+3]<45
){

let strong=0;

const n=[
i-4,
i+4,
i-canvas.width*4,
i+canvas.width*4
];

for(const q of n){

if(p[q+3]>150)strong++;

}

if(strong===0)
p[i+3]=0;

}

}

}

ctx.putImageData(imageData,0,0);


/*
CREATE BACKGROUND
*/

const out=document.createElement("canvas");

out.width=canvas.width;
out.height=canvas.height;

const octx=out.getContext("2d");

let colour=bg.value;

if(colour==="custom")
colour=custom.value;

if(colour!=="transparent"){

octx.fillStyle=colour;

octx.fillRect(
0,0,
out.width,
out.height
);

}

octx.drawImage(canvas,0,0);


/*
PNG keeps transparent background.
*/

out.toBlob(blob=>{

finalBlob=blob;

result.src=URL.createObjectURL(blob);

result.style.display="block";
resultText.style.display="none";

download.disabled=false;

},"image/png");

}


/* CHANGE BACKGROUND WITHOUT AI */

bg.onchange=()=>{

if(cutout)
renderResult();

};

custom.oninput=()=>{

if(cutout && bg.value==="custom")
renderResult();

};


/* DOWNLOAD */

download.onclick=()=>{

if(!finalBlob)return;

const a=document.createElement("a");

a.href=URL.createObjectURL(finalBlob);

a.download="RG-Digital-Background-Removed.png";

a.click();

};


/* IMAGE LOADER */

function loadImage(url){

return new Promise((resolve,reject)=>{

const img=new Image();

img.onload=()=>resolve(img);

img.onerror=reject;

img.src=url;

});

}

</script>

</body>
</html>
