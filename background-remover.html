<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Background Remover - RG Digital</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}
header{background:#111827;color:white;text-align:center;padding:25px 15px}
header h1{margin:0;font-size:30px}
header p{margin:8px 0}
.container{max-width:950px;margin:25px auto;padding:15px}
.card{background:white;border-radius:16px;padding:25px;box-shadow:0 5px 20px #0001}
.upload{border:2px dashed #999;border-radius:12px;padding:30px;text-align:center}
input[type=file]{max-width:100%;margin:15px 0}
button{border:0;background:#111827;color:white;padding:14px 22px;border-radius:9px;font-weight:bold;font-size:16px;cursor:pointer;margin:8px}
button:disabled{background:#aaa}
.preview{margin-top:20px;min-height:300px;border-radius:12px;padding:20px;text-align:center;background:#eee}
.preview img{max-width:100%;max-height:550px}
.status{text-align:center;font-weight:bold;margin:18px}
.success{color:#16803c}
.error{color:#c62828}
.actions{text-align:center}
footer{margin-top:30px;background:#111827;color:white;text-align:center;padding:22px}
</style>
</head>

<body>

<header>
<h1>✂️ AI Background Remover</h1>
<p>Remove Image Background Automatically</p>
</header>

<div class="container">

<div class="card">

<div class="upload">

<h2>📸 Select Your Image</h2>

<input
type="file"
id="file"
accept="image/jpeg,image/png,image/webp">

</div>

<div class="preview">

<img
id="originalPreview"
style="display:none"
alt="Original Image">

<p id="previewText">
Your selected image will appear here
</p>

</div>

<div style="text-align:center">

<button id="removeBtn" disabled>
✨ Remove Background
</button>

</div>

<div id="status" class="status"></div>

<div class="preview">

<img
id="resultPreview"
style="display:none"
alt="Background Removed">

<p id="resultText">
Background removed image will appear here
</p>

</div>

<div class="actions">

<button id="downloadBtn" disabled>
⬇️ Download PNG
</button>

</div>

</div>

</div>

<footer>
© 2026 RG Digital Image Tools
</footer>


<script type="module">

const fileInput =
document.getElementById("file");

const originalPreview =
document.getElementById("originalPreview");

const previewText =
document.getElementById("previewText");

const removeBtn =
document.getElementById("removeBtn");

const status =
document.getElementById("status");

const resultPreview =
document.getElementById("resultPreview");

const resultText =
document.getElementById("resultText");

const downloadBtn =
document.getElementById("downloadBtn");


let selectedFile = null;
let resultBlob = null;


/* SELECT IMAGE */

fileInput.addEventListener("change",function(){

selectedFile = this.files[0];

if(!selectedFile){

removeBtn.disabled = true;
return;

}


/* SHOW ORIGINAL IMAGE */

const url =
URL.createObjectURL(selectedFile);

originalPreview.src = url;

originalPreview.style.display = "block";

previewText.style.display = "none";

removeBtn.disabled = false;

resultPreview.style.display = "none";

resultText.style.display = "block";

downloadBtn.disabled = true;

status.innerHTML =
'<span class="success">✅ Image selected successfully</span>';

});


/* REMOVE BACKGROUND */

removeBtn.addEventListener("click",async function(){

if(!selectedFile)return;

removeBtn.disabled = true;

downloadBtn.disabled = true;

status.textContent =
"⏳ Loading AI Background Remover...";


try{


/*
IMPORTANT:
Use named export.
*/

const library =
await import(
"https://esm.sh/@imgly/background-removal@1.7.0"
);

const removeBackground =
library.removeBackground;


if(typeof removeBackground !== "function"){

throw new Error(
"AI library could not load correctly."
);

}


status.textContent =
"⏳ AI model loading... First time may take a while.";


/* AI PROCESSING */

resultBlob =
await removeBackground(
selectedFile,
{

model:"isnet",

device:"cpu",

proxyToWorker:false,

output:{
format:"image/png",
quality:1
},

progress:function(
key,
current,
total
){

if(total){

const percent =
Math.round(
(current/total)*100
);

status.textContent =
"⏳ AI Processing: "+
percent+
"%";

}

}

}
);


/* SHOW RESULT */

const resultURL =
URL.createObjectURL(resultBlob);

resultPreview.src =
resultURL;

resultPreview.style.display =
"block";

resultText.style.display =
"none";

downloadBtn.disabled =
false;

status.innerHTML =
'<span class="success">'+
"✅ Background Removed Successfully!"+
"</span>";


}catch(error){

console.error(error);

status.innerHTML =
'<span class="error">'+
"❌ AI processing failed."+
"<br>"+
error.message+
"</span>";

}

removeBtn.disabled = false;

});


/* DOWNLOAD */

downloadBtn.addEventListener(
"click",
function(){

if(!resultBlob)return;

const url =
URL.createObjectURL(resultBlob);

const a =
document.createElement("a");

a.href = url;

a.download =
"RG-Digital-Background-Removed.png";

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(
function(){

URL.revokeObjectURL(url);

},
1000
);

});


</script>

</body>
</html>
