<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Image to 50KB - RG Digital</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fb;
color:#222
}

header{
background:#111827;
color:#fff;
text-align:center;
padding:25px 15px
}

header h1{
margin:0;
font-size:30px
}

header p{
margin:8px 0 0
}

.container{
max-width:800px;
margin:25px auto;
padding:0 15px
}

.card{
background:#fff;
padding:25px;
border-radius:16px;
box-shadow:0 5px 20px rgba(0,0,0,.08)
}

.upload{
border:2px dashed #999;
padding:30px;
border-radius:12px;
text-align:center
}

input{
max-width:100%
}

.info{
background:#f3f4f6;
padding:14px;
border-radius:10px;
margin-top:15px
}

button{
background:#111827;
color:white;
border:0;
padding:13px 20px;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:15px
}

button:disabled{
background:#aaa;
cursor:not-allowed
}

#result{
display:none;
text-align:center;
margin-top:25px
}

#preview{
max-width:100%;
max-height:450px;
border:1px solid #ddd;
border-radius:10px
}

.success{
color:#166534;
font-weight:bold;
margin-top:15px
}

.error{
color:#b91c1c;
font-weight:bold;
margin-top:15px
}

footer{
margin-top:30px;
background:#111827;
color:white;
text-align:center;
padding:20px
}
</style>
</head>

<body>

<header>
<h1>Image to 50KB</h1>
<p>Compress Any Image to 50KB or Less</p>
</header>

<div class="container">

<div class="card">

<div class="upload">

<h2>Select Image</h2>

<p>JPG, JPEG, PNG or WebP</p>

<input
type="file"
id="file"
accept="image/jpeg,image/png,image/webp">

</div>

<div
id="original"
class="info"
style="display:none">
</div>

<div id="status"></div>

<div id="result">

<h2>Compressed Image</h2>

<img id="preview" alt="50KB compressed image">

<div id="resultInfo" class="info"></div>

<button id="download">
Download Image
</button>

</div>

</div>

</div>

<footer>
© 2026 RG Digital Image Tools
</footer>


<script>

const LIMIT = 50 * 1024;

const fileInput =
document.getElementById("file");

const original =
document.getElementById("original");

const status =
document.getElementById("status");

const result =
document.getElementById("result");

const preview =
document.getElementById("preview");

const resultInfo =
document.getElementById("resultInfo");

const download =
document.getElementById("download");

let finalBlob = null;


/* IMAGE SELECT */

fileInput.addEventListener("change",function(){

const file=this.files[0];

if(!file)return;

result.style.display="none";
download.disabled=true;
finalBlob=null;

original.style.display="block";

original.innerHTML=
"<b>Original:</b> "+
formatSize(file.size);

status.innerHTML=
"⏳ Processing... Please wait.";

const reader=new FileReader();

reader.onload=function(e){

const img=new Image();

img.onload=async function(){

original.innerHTML=
"<b>Original:</b> "+
formatSize(file.size)+
"<br>"+
"<b>Dimensions:</b> "+
img.naturalWidth+
" × "+
img.naturalHeight+
" px";

finalBlob=
await compressFast(img);

if(!finalBlob){

status.innerHTML=
'<div class="error">'+
"Could not create image under 50KB."+
"</div>";

return;
}


/* FINAL SAFETY */

if(finalBlob.size>LIMIT){

status.innerHTML=
'<div class="error">'+
"Download blocked: file is above 50KB."+
"</div>";

download.disabled=true;

return;
}


/* RESULT */

preview.src=
URL.createObjectURL(finalBlob);

result.style.display="block";

resultInfo.innerHTML=
"<b>Final Size:</b> "+
formatSize(finalBlob.size)+
"<br>"+
"<b>Maximum:</b> 50KB";

status.innerHTML=
'<div class="success">'+
"Success! Image is 50KB or less. ✅"+
"</div>";

download.disabled=false;

};

img.onerror=function(){

status.innerHTML=
'<div class="error">Invalid image.</div>';

};

img.src=e.target.result;

};

reader.readAsDataURL(file);

});


/*
==========================================
FAST COMPRESSION
==========================================
*/

async function compressFast(img){

/*
For very large images, first reduce
to a reasonable working size.
*/

let maxSide=1600;

let scale=Math.min(
1,
maxSide/img.naturalWidth,
maxSide/img.naturalHeight
);

let width=Math.max(
20,
Math.round(img.naturalWidth*scale)
);

let height=Math.max(
20,
Math.round(img.naturalHeight*scale)
);


/*
Try several dimension levels.
*/

for(let attempt=0;attempt<12;attempt++){

const canvas=
document.createElement("canvas");

canvas.width=width;
canvas.height=height;

const ctx=
canvas.getContext("2d");

ctx.fillStyle="#fff";

ctx.fillRect(
0,
0,
width,
height
);

ctx.drawImage(
img,
0,
0,
width,
height
);


/*
Try quality levels.
Only a few attempts = FAST.
*/

const qualities=[
0.75,
0.55,
0.40,
0.28,
0.18,
0.10,
0.05,
0.02
];

for(const q of qualities){

const blob=
await toJpeg(canvas,q);

if(blob && blob.size<=LIMIT){

return blob;

}

}


/*
Still above 50KB:
reduce dimensions by 20%.
*/

width=Math.floor(width*0.80);
height=Math.floor(height*0.80);

if(width<30 || height<30){
break;
}

}


/*
Final emergency compression.
*/

const canvas=
document.createElement("canvas");

canvas.width=30;
canvas.height=30;

const ctx=
canvas.getContext("2d");

ctx.drawImage(
img,
0,
0,
30,
30
);

const blob=
await toJpeg(canvas,0.01);

if(blob && blob.size<=LIMIT){

return blob;

}

return null;

}


/*
==========================================
JPEG
==========================================
*/

function toJpeg(canvas,quality){

return new Promise(resolve=>{

canvas.toBlob(
blob=>resolve(blob),
"image/jpeg",
quality
);

});

}


/*
==========================================
DOWNLOAD
==========================================
*/

download.addEventListener("click",function(){

if(!finalBlob)return;


/*
ABSOLUTE 50KB CHECK
*/

if(finalBlob.size>LIMIT){

alert(
"Download blocked. File is larger than 50KB."
);

download.disabled=true;

return;
}

const url=
URL.createObjectURL(finalBlob);

const a=
document.createElement("a");

a.href=url;

a.download=
"rg-digital-50kb.jpg";

document.body.appendChild(a);

a.click();

document.body.removeChild(a);

setTimeout(function(){

URL.revokeObjectURL(url);

},1000);

});


/*
==========================================
SIZE
==========================================
*/

function formatSize(bytes){

return(
(bytes/1024).toFixed(2)+
" KB"
);

}

</script>

</body>
</html>
