<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Resize Image to 20KB Online Free | RG Digital</title>

<meta name="description" content="Compress and resize image to 20KB or less online for free.">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fb;
color:#222
}

header{
background:#111827;
color:white;
text-align:center;
padding:28px 15px
}

header h1{margin:0;font-size:30px}
header p{margin:8px 0}

.container{
max-width:850px;
margin:25px auto;
padding:0 15px
}

.card{
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,.08)
}

.upload{
border:2px dashed #999;
padding:30px 15px;
text-align:center;
border-radius:14px
}

input[type=file]{max-width:100%}

.info{
background:#f3f4f6;
padding:15px;
border-radius:10px;
margin-top:18px
}

button{
border:0;
background:#111827;
color:white;
padding:13px 20px;
border-radius:9px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin:10px 5px 0 0
}

button:disabled{
opacity:.5;
cursor:not-allowed
}

.preview{
display:none;
text-align:center;
margin-top:25px
}

.preview img{
max-width:100%;
max-height:500px;
border:1px solid #ddd;
border-radius:10px
}

.success{
color:#166534;
font-weight:bold;
margin-top:15px
}

.error{
color:#b91c1c;
font-weight:bold;
margin-top:15px
}

footer{
margin-top:30px;
background:#111827;
color:white;
text-align:center;
padding:25px
}

footer a{
color:white;
margin:0 7px;
text-decoration:none
}

@media(max-width:600px){
header h1{font-size:25px}
.card{padding:18px}
}
</style>
</head>

<body>

<header>
<h1>Resize Image to 20KB</h1>
<p>Make Your Image 20KB or Less</p>
</header>

<div class="container">

<div class="card">

<div class="upload">
<h2>Select Image</h2>
<p>JPG, JPEG, PNG or WebP</p>

<input type="file"
id="imageInput"
accept="image/jpeg,image/png,image/webp">
</div>

<div id="originalInfo" class="info" style="display:none"></div>

<div id="message"></div>

<div id="result" style="display:none">

<div class="preview" id="preview">
<h2>Result</h2>

<img id="previewImage" alt="20KB image preview">

<div id="resultInfo" class="info"></div>

<button id="downloadBtn">
Download Image
</button>

</div>

</div>

</div>

</div>

<footer>
<p>© 2026 RG Digital Image Tools</p>
</footer>

<script>

const input=document.getElementById("imageInput");
const originalInfo=document.getElementById("originalInfo");
const message=document.getElementById("message");
const preview=document.getElementById("preview");
const previewImage=document.getElementById("previewImage");
const resultInfo=document.getElementById("resultInfo");
const downloadBtn=document.getElementById("downloadBtn");

let finalBlob=null;

input.addEventListener("change",function(){

const file=this.files[0];

if(!file)return;

message.innerHTML="";
preview.style.display="none";
finalBlob=null;

const reader=new FileReader();

reader.onload=function(e){

const img=new Image();

img.onload=async function(){

originalInfo.style.display="block";

originalInfo.innerHTML=
"<strong>Original Image</strong><br>"+
"Dimensions: "+
img.naturalWidth+" × "+img.naturalHeight+
" px<br>"+
"File size: "+
formatBytes(file.size);

message.innerHTML="Creating image 20KB or less... Please wait.";

finalBlob=await makeUnder20KB(img);

if(!finalBlob){

message.innerHTML=
'<div class="error">This image could not be reduced to 20KB. Please try a smaller image.</div>';

return;
}

const url=URL.createObjectURL(finalBlob);

previewImage.src=url;

preview.style.display="block";

resultInfo.innerHTML=
"<strong>Final Result</strong><br>"+
"File size: <b>"+
formatBytes(finalBlob.size)+
"</b><br>"+
"Maximum allowed: <b>20KB</b>";

message.innerHTML=
'<div class="success">Success! Image is 20KB or less. ✅</div>';

};

img.src=e.target.result;

};

reader.readAsDataURL(file);

});


async function makeUnder20KB(img){

const limit=20*1024;

let width=img.naturalWidth;
let height=img.naturalHeight;

/*
Start with original dimensions.
If necessary, gradually reduce dimensions.
*/

for(let dimensionScale=1;
dimensionScale>=0.1;
dimensionScale-=0.05){

let w=Math.max(1,Math.round(width*dimensionScale));
let h=Math.max(1,Math.round(height*dimensionScale));

const canvas=document.createElement("canvas");

canvas.width=w;
canvas.height=h;

const ctx=canvas.getContext("2d");

ctx.drawImage(img,0,0,w,h);

/*
Try many JPEG quality levels.
*/

for(let quality=0.95;
quality>=0.05;
quality-=0.05){

const blob=await canvasToBlob(
canvas,
quality
);

if(blob && blob.size<=limit){

return blob;

}

}

}

return null;

}


function canvasToBlob(canvas,quality){

return new Promise(resolve=>{

canvas.toBlob(
blob=>resolve(blob),
"image/jpeg",
quality
);

});

}


downloadBtn.addEventListener("click",function(){

if(!finalBlob)return;

/*
Safety check:
Never download a file larger than 20KB.
*/

if(finalBlob.size>20*1024){

alert("File is larger than 20KB and cannot be downloaded.");

return;

}

const url=URL.createObjectURL(finalBlob);

const a=document.createElement("a");

a.href=url;
a.download="rg-digital-20kb.jpg";

document.body.appendChild(a);

a.click();

document.body.removeChild(a);

setTimeout(function(){
URL.revokeObjectURL(url);
},1000);

});


function formatBytes(bytes){

if(bytes===0)return "0 Bytes";

const sizes=[
"Bytes",
"KB",
"MB",
"GB"
];

const i=Math.floor(
Math.log(bytes)/Math.log(1024)
);

return(
parseFloat(
(bytes/Math.pow(1024,i)).toFixed(2)
)+" "+sizes[i]
);

}

</script>

</body>
</html>
