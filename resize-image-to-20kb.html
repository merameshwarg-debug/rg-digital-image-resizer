<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Image to 20KB - RG Digital</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fb;
color:#222
}

header{
background:#111827;
color:white;
text-align:center;
padding:25px 10px
}

header h1{
margin:0;
font-size:28px
}

.container{
max-width:850px;
margin:25px auto;
padding:0 15px
}

.card{
background:white;
padding:25px;
border-radius:16px;
box-shadow:0 4px 15px rgba(0,0,0,.08)
}

.upload{
border:2px dashed #888;
padding:30px 15px;
border-radius:12px;
text-align:center
}

input{
max-width:100%
}

.info{
background:#f1f3f5;
padding:15px;
border-radius:10px;
margin-top:15px
}

button{
background:#111827;
color:white;
border:0;
padding:13px 20px;
border-radius:8px;
font-size:16px;
font-weight:bold;
margin:15px 5px 0 0;
cursor:pointer
}

button:disabled{
background:#aaa;
cursor:not-allowed
}

#result{
display:none;
text-align:center;
margin-top:25px
}

#previewImage{
max-width:100%;
max-height:500px;
border-radius:10px;
border:1px solid #ddd
}

.success{
color:#166534;
font-weight:bold;
margin-top:15px
}

.error{
color:#b91c1c;
font-weight:bold;
margin-top:15px
}

footer{
margin-top:30px;
background:#111827;
color:white;
text-align:center;
padding:20px
}
</style>
</head>

<body>

<header>
<h1>Image to 20KB</h1>
<p>Compress Any Image to 20KB or Less</p>
</header>

<div class="container">

<div class="card">

<div class="upload">

<h2>Select Image</h2>

<p>JPG, PNG or WebP</p>

<input
type="file"
id="imageInput"
accept="image/jpeg,image/png,image/webp">

</div>

<div
id="originalInfo"
class="info"
style="display:none">
</div>

<div id="message"></div>

<div id="result">

<h2>Result</h2>

<img
id="previewImage"
alt="Compressed image">

<div
id="resultInfo"
class="info">
</div>

<button
id="downloadBtn"
disabled>
Download Image
</button>

</div>

</div>

</div>

<footer>
© 2026 RG Digital Image Tools
</footer>

<script>

const LIMIT = 20 * 1024;

const input =
document.getElementById("imageInput");

const originalInfo =
document.getElementById("originalInfo");

const message =
document.getElementById("message");

const result =
document.getElementById("result");

const previewImage =
document.getElementById("previewImage");

const resultInfo =
document.getElementById("resultInfo");

const downloadBtn =
document.getElementById("downloadBtn");

let finalBlob = null;


/* SELECT IMAGE */

input.addEventListener("change",function(){

const file=this.files[0];

if(!file)return;

result.style.display="none";

downloadBtn.disabled=true;

finalBlob=null;

message.innerHTML=
"Processing... Please wait.";

originalInfo.style.display="block";

originalInfo.innerHTML=
"<b>Original Image</b><br>"+
"File size: "+
formatSize(file.size);

const reader=new FileReader();

reader.onload=function(e){

const img=new Image();

img.onload=async function(){

originalInfo.innerHTML=
"<b>Original Image</b><br>"+
"Dimensions: "+
img.naturalWidth+
" × "+
img.naturalHeight+
" px<br>"+
"File size: "+
formatSize(file.size);

finalBlob=
await compressTo20KB(img);

if(!finalBlob){

message.innerHTML=
'<div class="error">'+
"Unable to create image under 20KB."+
"</div>";

return;
}


/*
IMPORTANT:
Final safety check.
*/

if(finalBlob.size > LIMIT){

message.innerHTML=
'<div class="error">'+
"20KB limit not reached. Download blocked."+
"</div>";

downloadBtn.disabled=true;

return;
}


/* SHOW RESULT */

const url=
URL.createObjectURL(finalBlob);

previewImage.src=url;

result.style.display="block";

resultInfo.innerHTML=
"<b>Final dimensions:</b> "+
previewImage.naturalWidth+
" × "+
previewImage.naturalHeight+
" px<br>"+
"<b>Final file size:</b> "+
formatSize(finalBlob.size)+
"<br>"+
"<b>Maximum allowed:</b> 20KB";

message.innerHTML=
'<div class="success">'+
"Success! Image is 20KB or less. ✅"+
"</div>";

downloadBtn.disabled=false;

};

img.onerror=function(){

message.innerHTML=
'<div class="error">'+
"Unable to read image."+
"</div>";

};

img.src=e.target.result;

};

reader.readAsDataURL(file);

});


/*
==================================================
COMPRESS TO 20KB
==================================================
*/

async function compressTo20KB(img){

/*
Start with original dimensions.
Then progressively reduce dimensions.
*/

let width=img.naturalWidth;
let height=img.naturalHeight;


/*
Try many sizes.
This is deliberately aggressive so that
20KB is always the maximum.
*/

for(let scale=1; scale>=0.03; scale-=0.04){

let w=Math.max(
20,
Math.round(width*scale)
);

let h=Math.max(
20,
Math.round(height*scale)
);

const canvas=
document.createElement("canvas");

canvas.width=w;
canvas.height=h;

const ctx=
canvas.getContext("2d");

ctx.fillStyle="#fff";

ctx.fillRect(
0,
0,
w,
h
);

ctx.drawImage(
img,
0,
0,
w,
h
);


/*
Try quality from high to extremely low.
*/

for(let q=0.90;q>=0.01;q-=0.03){

const blob=
await makeBlob(canvas,q);

if(blob && blob.size<=LIMIT){

return blob;

}

}

}


/*
Absolute last attempt.
Very small image + minimum quality.
*/

for(let size=100;size>=10;size-=5){

const canvas=
document.createElement("canvas");

const ratio=
img.naturalWidth/img.naturalHeight;

let w=size;

let h=Math.max(
1,
Math.round(size/ratio)
);

canvas.width=w;
canvas.height=h;

const ctx=
canvas.getContext("2d");

ctx.fillStyle="#fff";

ctx.fillRect(
0,
0,
w,
h
);

ctx.drawImage(
img,
0,
0,
w,
h
);

const blob=
await makeBlob(canvas,0.01);

if(blob && blob.size<=LIMIT){

return blob;

}

}

return null;

}


/*
==================================================
CREATE JPEG
==================================================
*/

function makeBlob(canvas,quality){

return new Promise(resolve=>{

canvas.toBlob(
blob=>resolve(blob),
"image/jpeg",
quality
);

});

}


/*
==================================================
DOWNLOAD
==================================================
*/

downloadBtn.addEventListener("click",function(){

/*
NEVER allow more than 20KB.
*/

if(!finalBlob){

alert("No image ready.");

return;
}

if(finalBlob.size>LIMIT){

alert(
"Download blocked. File is larger than 20KB."
);

return;
}

const url=
URL.createObjectURL(finalBlob);

const a=
document.createElement("a");

a.href=url;

a.download=
"rg-digital-20kb.jpg";

document.body.appendChild(a);

a.click();

document.body.removeChild(a);

setTimeout(()=>{
URL.revokeObjectURL(url);
},1000);

});


/*
==================================================
FILE SIZE
==================================================
*/

function formatSize(bytes){

return(
(bytes/1024).toFixed(2)+
" KB"
);

}

</script>

</body>
</html>
