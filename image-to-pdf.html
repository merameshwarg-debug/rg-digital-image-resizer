<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image to PDF - RG Digital</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>body{font-family:Arial;background:#f4f7fb;text-align:center;padding:25px}main{background:white;padding:25px;border-radius:15px;max-width:600px;margin:auto}button{padding:13px 20px;margin:15px;background:#111827;color:white;border:0;border-radius:8px;font-weight:bold}#msg{font-weight:bold}</style></head><body><main><h1>📸 Image to PDF</h1><p>Select one or multiple images</p><input id="files" type="file" accept="image/*" multiple><br><button id="go">Create PDF</button><div id="msg"></div></main><script>go.onclick=async()=>{let f=[...files.files];if(!f.length)return msg.innerText="Please select image(s).";let{jsPDF}=window.jspdf,p=new jsPDF("p","mm","a4");for(let i=0;i<f.length;i++){if(i)p.addPage();let u=URL.createObjectURL(f[i]),im=new Image();await new Promise(r=>{im.onload=r;im.src=u});let m=10,w=190,h=277,r=Math.min(w/im.width,h/im.height),x=(210-im.width*r)/2,y=(297-im.height*r)/2;p.addImage(im,"JPEG",x,y,im.width*r,im.height*r);URL.revokeObjectURL(u)}p.save("RG-Digital-Image-to-PDF.pdf");msg.innerText="PDF Ready ✅"}</script></body></html>
